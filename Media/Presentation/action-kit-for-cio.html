klog theo tuần. Nhóm chỉ số cốt lõi chứng minh AI đã thay đổi cách công việc chạy.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding: 10px 12px;\">\n      <div class=\"tag-pill yellow\" style=\"margin-bottom: 4px;\">Chất lượng &amp; trải nghiệm<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0; font-size: 9.5pt;\">\n        Tỷ lệ lỗi, rework, complaint/1.000 giao dịch, NPS nội bộ và khách hàng, CSAT. Bảo vệ tổ chức khỏi bẫy \"nhanh hơn nhưng tệ hơn\".\n      <\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding: 10px 12px;\">\n      <div class=\"tag-pill yellow\" style=\"margin-bottom: 4px;\">Hiệu quả sử dụng AI<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0; font-size: 9.5pt;\">\n        Phần trăm tác vụ có AI hỗ trợ, số phiên AI / user / tuần, tỷ lệ đề xuất AI được chấp nhận. Cho biết AI có sống trong luồng — hay chỉ trong demo.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"t-h3\" style=\"margin-bottom: 4mm;\">Mapping mục tiêu chiến lược với KPI và case thực tế<\u002Fh3>\n\n  <div class=\"kpi-grid\">\n    <div class=\"kpi-row\">\n      <div class=\"kr-cell kr-goal\">\n        <div class=\"kr-lbl\">Mục tiêu<\u002Fdiv>\n        <div class=\"kr-title\">Giảm thời gian xử lý yêu cầu khách hàng<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kr-cell kr-kpi\">\n        <div class=\"kr-lbl\">KPI<\u002Fdiv>\n        <div class=\"kr-text\">Cycle time ticket từ lúc tạo đến lúc đóng.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kr-cell kr-case\">\n        <div class=\"kr-lbl\">Case<\u002Fdiv>\n        <div class=\"kr-text\"><strong>Nationwide:<\u002Fstrong> 45 phút → 10–15 phút <span style=\"color: var(--biplus-yellow-dark); font-weight: 800;\">(–66%)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"kpi-row\">\n      <div class=\"kr-cell kr-goal\">\n        <div class=\"kr-lbl\">Mục tiêu<\u002Fdiv>\n        <div class=\"kr-title\">Tăng chất lượng và nhất quán phản hồi<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kr-cell kr-kpi\">\n        <div class=\"kr-lbl\">KPI<\u002Fdiv>\n        <div class=\"kr-text\">Tỷ lệ khiếu nại / yêu cầu · NPS sau tương tác.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kr-cell kr-case\">\n        <div class=\"kr-lbl\">Case<\u002Fdiv>\n        <div class=\"kr-text\"><strong>Nationwide:<\u002Fstrong> Nâng tuân thủ tone và nội dung theo policy ngân hàng.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"kpi-row\">\n      <div class=\"kr-cell kr-goal\">\n        <div class=\"kr-lbl\">Mục tiêu<\u002Fdiv>\n        <div class=\"kr-title\">Giảm chi phí vận hành toàn domain<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kr-cell kr-kpi\">\n        <div class=\"kr-lbl\">KPI<\u002Fdiv>\n        <div class=\"kr-text\">Số giờ tiết kiệm / năm · cost-to-serve / giao dịch.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kr-cell kr-case\">\n        <div class=\"kr-lbl\">Case<\u002Fdiv>\n        <div class=\"kr-text\"><strong>Aberdeen City Council:<\u002Fstrong> ROI 241% · ~3 triệu USD/năm.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"kpi-row\">\n      <div class=\"kr-cell kr-goal\">\n        <div class=\"kr-lbl\">Mục tiêu<\u002Fdiv>\n        <div class=\"kr-title\">Rút ngắn quy trình cross-department<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kr-cell kr-kpi\">\n        <div class=\"kr-lbl\">KPI<\u002Fdiv>\n        <div class=\"kr-text\">Lead time end-to-end.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kr-cell kr-case\">\n        <div class=\"kr-lbl\">Case<\u002Fdiv>\n        <div class=\"kr-text\"><strong>Lenovo:<\u002Fstrong> 6 ngày → 2 ngày <span style=\"color: var(--biplus-yellow-dark); font-weight: 800;\">(–67%)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p class=\"t-cap\" style=\"margin-top: 4mm;\">\n    Các KPI phải được log tự động qua issue field, SLA metric, worklog và form — để so sánh trước/sau triển khai. Dashboard cập nhật thủ công → số liệu chậm và không đáng tin để ra quyết định.\n  <\u002Fp>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Bước 04 · KPI và OKR<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 14 — Bước 5 + Hình 5: RACI\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"14 Buoc 5 RACI\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">02 Khung hành động <span class=\"sep\">·<\u002Fspan> Bước 05 · Hình 5<\u002Fspan>\n    <span class=\"ph-page-num\">14<\u002Fspan>\n  <\u002Fheader>\n\n  <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 4mm;\">\n    <span style=\"font-family: var(--font-display); font-weight: 800; font-size: 38pt; color: var(--biplus-yellow-dark); line-height: 1;\">05<\u002Fspan>\n    <h2 class=\"t-h1\" style=\"margin: 0;\">Phân công trách nhiệm và mô hình vận hành.<\u002Fh2>\n  <\u002Fdiv>\n\n  <p class=\"t-body-lg\" style=\"margin-bottom: 6mm;\">\n    Mọi sáng kiến AI phải trả lời rõ: ai chịu trách nhiệm về quy trình, dữ liệu, AI và kết quả kinh doanh. Không có ownership rõ ràng — AI trở thành \"sản phẩm chung\" mà không ai nuôi.\n  <\u002Fp>\n\n  <div class=\"figure\">\n    <div class=\"raci-wrap\">\n      <div class=\"raci-cio\">\n        <div class=\"rc-eyebrow\">Accountable<\u002Fdiv>\n        <div class=\"rc-name\">CIO<\u002Fdiv>\n        <div class=\"rc-sub\">Kiến trúc System of Work · lựa chọn Platform · guardrail AI<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"raci-row\">\n        <div class=\"raci-card\">\n          <div class=\"rc-tag\">Responsible<\u002Fdiv>\n          <div class=\"rc-role\">Business /<br>Process Owner<\u002Fdiv>\n          <ul class=\"rc-list\">\n            <li>Outcome kinh doanh<\u002Fli>\n            <li>KPI quy trình<\u002Fli>\n            <li>Phê duyệt thay đổi<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"raci-card\">\n          <div class=\"rc-tag\">Responsible<\u002Fdiv>\n          <div class=\"rc-role\">Đội dữ liệu<\u002Fdiv>\n          <ul class=\"rc-list\">\n            <li>Data model<\u002Fli>\n            <li>Chất lượng dữ liệu<\u002Fli>\n            <li>Data lineage<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"raci-card\">\n          <div class=\"rc-tag\">Responsible<\u002Fdiv>\n          <div class=\"rc-role\">Vận hành / PMO<\u002Fdiv>\n          <ul class=\"rc-list\">\n            <li>Điều phối rollout<\u002Fli>\n            <li>Backlog cải tiến<\u002Fli>\n            <li>Theo dõi chất lượng<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"raci-card\">\n          <div class=\"rc-tag\">Responsible<\u002Fdiv>\n          <div class=\"rc-role\">Change Mgmt / HR<\u002Fdiv>\n          <ul class=\"rc-list\">\n            <li>Đào tạo, truyền thông<\u002Fli>\n            <li>Adoption<\u002Fli>\n            <li>Thay đổi hành vi<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"raci-card\">\n          <div class=\"rc-tag\">Responsible<\u002Fdiv>\n          <div class=\"rc-role\">Đội bảo mật<\u002Fdiv>\n          <ul class=\"rc-list\">\n            <li>Policy AI guardrail<\u002Fli>\n            <li>DLP, audit controls<\u002Fli>\n            <li>Incident response<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"figure-cap\">\n      <strong>Hình 5.<\u002Fstrong> Mô hình RACI tối thiểu cho một chương trình AI trên Work Platform. CIO là <em>accountable<\u002Fem> cho toàn bộ kiến trúc; mỗi workflow, dataset, policy có owner cụ thể trong Platform — tránh AI thành \"sản phẩm chung không ai nuôi\".\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p class=\"t-cap\" style=\"margin-top: 6mm;\">\n    Ownership phải được phản chiếu trực tiếp trong Work Platform — không phải trong email. Mỗi quy trình tương ứng với một workflow có owner, mỗi tập dữ liệu tương ứng với một project hoặc space có owner, mỗi policy AI có owner riêng. Khi có sự cố, câu hỏi \"ai chịu trách nhiệm\" phải có câu trả lời ngay.\n  <\u002Fp>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Bước 05 · RACI<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 15 — SECTION DIVIDER 03 — Lộ trình\n=================================================================== -->\n<section class=\"page section-page\" data-screen-label=\"15 Section 03\">\n  <div class=\"page-inner\">\n    <div>\n      <span class=\"sp-eyebrow\">Phần 03<\u002Fspan>\n      <div class=\"sp-num\">03<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h1 class=\"sp-title\">Lộ trình triển khai — từ pilot kiểm soát rủi ro đến scale đo được.<\u002Fh1>\n      <p class=\"sp-sub\">Không trải thảm AI toàn công ty. Bắt đầu từ một đến hai dòng công việc có pain rõ và sponsor mạnh — sau đó mở rộng theo domain.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Section 03 · Lộ trình<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 16 — Hình 6: Timeline\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"16 Hinh 6 Timeline\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">03 Lộ trình <span class=\"sep\">·<\u002Fspan> Hình 6<\u002Fspan>\n    <span class=\"ph-page-num\">15<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Lộ trình pilot → scale — không trải thảm AI toàn công ty.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 6mm; margin-bottom: 8mm;\">\n    Bốn mốc thời gian dưới đây là khung tham chiếu. Tốc độ thực tế phụ thuộc vào mức độ trưởng thành Work Platform — nhưng thứ tự thì không nên đảo.\n  <\u002Fp>\n\n  <div class=\"figure\">\n    <div class=\"tl-zones\">\n      <div class=\"tlz pilot\">Pilot zone — rủi ro kiểm soát được<\u002Fdiv>\n      <div class=\"tlz scale\">Scale zone — kết quả có thể đo<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"tl-track\">\n      <div class=\"tl-stop c1\">\n        <div class=\"tls-when\">Tuần 1–4<\u002Fdiv>\n        <div class=\"tls-dot\"><\u002Fdiv>\n        <div class=\"tls-label\">DISCOVERY<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-stop c2\">\n        <div class=\"tls-when\">Tháng 2–3<\u002Fdiv>\n        <div class=\"tls-dot\"><\u002Fdiv>\n        <div class=\"tls-label\">PILOT<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-stop c3\">\n        <div class=\"tls-when\">Tháng 4–6<\u002Fdiv>\n        <div class=\"tls-dot\"><\u002Fdiv>\n        <div class=\"tls-label\">SCALE-UP<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-stop c4\">\n        <div class=\"tls-when\">Tháng 7+<\u002Fdiv>\n        <div class=\"tls-dot\"><\u002Fdiv>\n        <div class=\"tls-label\">CONTINUOUS<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"tl-descriptions\">\n      <div class=\"tlds\">Map hiện trạng, chọn 1–2 domain pilot, chốt KPI baseline.<\u002Fdiv>\n      <div class=\"tlds\">Chuẩn hoá workflow, nhúng AI in-the-flow, human-in-the-loop.<\u002Fdiv>\n      <div class=\"tlds\">Mở rộng sang domain thứ 2, củng cố governance, truyền thông quick wins.<\u002Fdiv>\n      <div class=\"tlds\">Vận hành như sản phẩm, chu trình học liên tục, adoption vào KPI quản lý.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"figure-cap\" style=\"margin-top: 12px;\">\n      <strong>Hình 6.<\u002Fstrong> Lộ trình pilot đến scale theo mốc thời gian. Pilot zone chấp nhận rủi ro thử nghiệm; scale zone phải đo được kết quả.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"example-card\" style=\"margin-top: 8mm;\">\n    <div class=\"ex-eyebrow\">Ví dụ minh hoạ<\u002Fdiv>\n    <div class=\"ex-title\">BiPlus — AI-Enabled System of Work cho khách hàng tài chính<\u002Fdiv>\n    <p class=\"ex-body\">\n      Trong một chương trình tư vấn gần đây tại Việt Nam, BiPlus triển khai Work Platform trên Atlassian Cloud cho một tổ chức tài chính lớn. Domain pilot được chọn là vận hành ITSM nội bộ với pain point rõ về thời gian xử lý và sponsor cấp Giám đốc Khối. Sau 12 tuần pilot, cycle time giảm ~50% và adoption AI vượt 70% nhờ AI được nhúng đúng điểm chạm và human-in-the-loop được giữ cho mọi đề xuất nhạy cảm.\n    <\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Hình 6 · Roadmap timeline<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 17 — Hình 7: 4 AI capabilities\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"17 Hinh 7 AI capabilities\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">03 Lộ trình <span class=\"sep\">·<\u002Fspan> Hình 7<\u002Fspan>\n    <span class=\"ph-page-num\">16<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Bốn nhóm năng lực AI — triển khai theo thứ tự rủi ro và ROI.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 5mm; margin-bottom: 5mm;\">\n    Bắt đầu từ góc phần tư có ROI nhanh và rủi ro thấp — mở rộng dần khi knowledge base đủ chín và governance đủ vững.\n  <\u002Fp>\n\n  <div class=\"figure\">\n    <div class=\"matrix-wrap\">\n      <div class=\"matrix-yaxis\">\n        <span class=\"matrix-yaxis-top\">Nhanh<\u002Fspan>\n        <div class=\"my-label\">Tốc độ ra ROI →<\u002Fdiv>\n        <span class=\"matrix-yaxis-bot\">Chậm<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"matrix-grid\">\n        <div class=\"quadrant q-tl\">\n          <div class=\"q-name\">ASSISTANT<\u002Fdiv>\n          <div class=\"q-detail\">Soạn, tóm tắt,<br>rewrite in-context<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"quadrant q-tr\">\n          <div class=\"q-name\">KNOWLEDGE<br>&amp; SEARCH<\u002Fdiv>\n          <div class=\"q-detail\">Semantic search<br>trên teamwork graph<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"quadrant q-bl\">\n          <div class=\"q-name\">RECOMMEN-<br>DATION<\u002Fdiv>\n          <div class=\"q-detail\">Next-best-action,<br>gợi ý người/tri thức<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"quadrant q-br\">\n          <div class=\"q-name\">AUTOMATION<\u002Fdiv>\n          <div class=\"q-detail\">Chuyển trạng thái,<br>gán người, trigger integration<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"matrix-axis-marker start-good\">Điểm khởi đầu lý tưởng<\u002Fdiv>\n        <div class=\"matrix-axis-marker high-roi\">ROI cao khi KB đủ chín<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"matrix-empty\"><\u002Fdiv>\n      <div class=\"matrix-xaxis\">\n        <span class=\"mx-low\">Thấp<\u002Fspan>\n        Mức rủi ro / tác động vận hành →\n        <span class=\"mx-high\">Cao<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"callout-yellow\" style=\"margin-top: 10px;\">\n      Thứ tự triển khai gợi ý: Assistant → Knowledge &amp; Search → Recommendation → Automation\n    <\u002Fdiv>\n    <div class=\"figure-cap\">\n      <strong>Hình 7.<\u002Fstrong> Bốn nhóm năng lực AI định vị theo hai trục rủi ro và tốc độ ra ROI. Bắt đầu từ góc phần tư xanh, mở rộng dần.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"two-col\" style=\"margin-top: 5mm; gap: 5mm;\">\n    <div class=\"card tint\" style=\"padding: 10px 12px;\">\n      <div class=\"t-h4\" style=\"margin-bottom: 3px;\">Nguyên tắc 01 · Đúng điểm chạm<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0; font-size: 9.5pt;\">\n        AI phải xuất hiện ngay nơi người dùng đang làm việc — trong ticket, doc, chat. Không ép họ chuyển sang giao diện riêng.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card tint\" style=\"padding: 10px 12px;\">\n      <div class=\"t-h4\" style=\"margin-bottom: 3px;\">Nguyên tắc 02 · Human-in-the-loop<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0; font-size: 9.5pt;\">\n        Giữ vòng lặp con người với mọi đề xuất nhạy cảm. Giảm rủi ro AI sai, nâng niềm tin, tích luỹ dữ liệu để cải thiện chính AI.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Hình 7 · 4 AI capability quadrants<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 18 — Vận hành, giám sát, cải tiến liên tục\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"18 Van hanh\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">03 Lộ trình <span class=\"sep\">·<\u002Fspan> Vận hành liên tục<\u002Fspan>\n    <span class=\"ph-page-num\">17<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Vận hành, giám sát và cải tiến liên tục.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 6mm; margin-bottom: 8mm;\">\n    Khi pilot đã chứng minh giá trị, bài toán chuyển sang vận hành và scale. Một AI-enabled System of Work sống khoẻ cần tối thiểu ba lớp giám sát hoạt động song song.\n  <\u002Fp>\n\n  <div style=\"display: flex; flex-direction: column; gap: 5mm;\">\n    <div class=\"card\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;\">\n        <span class=\"tag-pill dark\">Lớp 01<\u002Fspan>\n        <div class=\"t-h3\">Logging và audit trail<\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        Ghi lại ai dùng AI, vào tác vụ gì, bị chỉnh sửa ra sao, quyết định nào dựa trên đề xuất AI. Lớp này phục vụ cả cải tiến liên tục và trả lời các yêu cầu kiểm toán nội bộ và bên ngoài.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;\">\n        <span class=\"tag-pill dark\">Lớp 02<\u002Fspan>\n        <div class=\"t-h3\">Đo lường hiệu suất<\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        SLA, backlog, throughput, tỷ lệ lỗi, NPS, adoption AI — kéo trực tiếp từ Work Platform, tránh thống kê tay. Dashboard phải cập nhật theo thời gian thực để CIO và process owner ra quyết định nhanh.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;\">\n        <span class=\"tag-pill dark\">Lớp 03<\u002Fspan>\n        <div class=\"t-h3\">Chu trình học liên tục<\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        Insight vận hành → tối ưu workflow → cập nhật rule, prompt, policy AI → đo lại để xác nhận tác động. Chu trình này cần được quản lý như backlog sản phẩm, không phải dự án một lần.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout-dark\" style=\"margin-top: 10mm;\">\n    Work Platform phải được cấu hình như một <em style=\"color: var(--biplus-yellow); font-style: normal;\">operational control plane<\u002Fem> cho AI — role và permission rõ, data retention phù hợp người và mô hình, audit trail đầy đủ.\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Vận hành và cải tiến<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 19 — SECTION DIVIDER 04 — Case study\n=================================================================== -->\n<section class=\"page section-page\" data-screen-label=\"19 Section 04\">\n  <div class=\"page-inner\">\n    <div>\n      <span class=\"sp-eyebrow\">Phần 04<\u002Fspan>\n      <div class=\"sp-num\">04<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h1 class=\"sp-title\">Case study với con số cụ thể — bảy ví dụ Việt Nam và quốc tế.<\u002Fh1>\n      <p class=\"sp-sub\">Điểm chung của các case thành công: không bắt đầu từ tool, mà bắt đầu từ workflow trên một Work Platform thống nhất. AI chỉ nhúng vào sau khi process đã có hình dạng.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Section 04 · Case studies<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 20 — Case study table\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"20 Case studies\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">04 Case study <span class=\"sep\">·<\u002Fspan> Bảy minh chứng<\u002Fspan>\n    <span class=\"ph-page-num\">18<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Bảy case đã được công bố hoặc xuất hiện trong thực tế triển khai.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 4mm; margin-bottom: 4mm; font-size: 11pt;\">\n    Lưu ý khi đọc: (1) biên độ kết quả phụ thuộc mức trưởng thành Work Platform; (2) giá trị thật đến từ kết hợp Workflow + Data + AI, không từ riêng một tool.\n  <\u002Fp>\n\n  <table class=\"case-table\">\n    <thead>\n      <tr>\n        <th style=\"width: 24%;\">Tổ chức<\u002Fth>\n        <th style=\"width: 22%;\">Kết quả nổi bật<\u002Fth>\n        <th>Điểm cốt lõi<\u002Fth>\n      <\u002Ftr>\n    <\u002Fthead>\n    <tbody>\n      <tr>\n        <td>\n          <span class=\"org\">Nationwide<\u002Fspan>\n          <span class=\"meta\">Bảo hiểm · Anh<\u002Fspan>\n        <\u002Ftd>\n        <td><span class=\"metric\">–66%<\u002Fspan><span class=\"t-body\">thời gian xử lý thư khách hàng (45ph → 10–15ph)<\u002Fspan><\u002Ftd>\n        <td><span class=\"t-body\">Nhúng GPT-4 vào luồng xử lý. Yếu tố quyết định: AI được đặt đúng điểm chạm, có policy về tone và tuân thủ tích hợp sẵn.<\u002Fspan><\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td>\n          <span class=\"org\">Aberdeen City Council<\u002Fspan>\n          <span class=\"meta\">Khu vực công · Scotland<\u002Fspan>\n        <\u002Ftd>\n        <td><span class=\"metric\">241% ROI<\u002Fspan><span class=\"t-body\">~3 triệu USD tiết kiệm / năm<\u002Fspan><\u002Ftd>\n        <td><span class=\"t-body\">Microsoft 365 Copilot dùng ngay trong quy trình soạn thảo, họp, báo cáo của nhân viên hành chính — không phải công cụ tách biệt.<\u002Fspan><\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td>\n          <span class=\"org\">Lenovo<\u002Fspan>\n          <span class=\"meta\">Công nghệ · Toàn cầu<\u002Fspan>\n        <\u002Ftd>\n        <td><span class=\"metric\">–67%<\u002Fspan><span class=\"t-body\">lead time quy trình cross-department (6 ngày → 2 ngày)<\u002Fspan><\u002Ftd>\n        <td><span class=\"t-body\">Đột phá đến từ việc chuẩn hoá luồng phê duyệt trên một nền tảng thống nhất — AI chỉ là tầng tăng tốc phía trên.<\u002Fspan><\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td>\n          <span class=\"org\">JPMorgan COiN<\u002Fspan>\n          <span class=\"meta\">Ngân hàng đầu tư · Mỹ<\u002Fspan>\n        <\u002Ftd>\n        <td><span class=\"metric\">360k giờ<\u002Fspan><span class=\"t-body\">giờ luật sư tiết kiệm / năm<\u002Fspan><\u002Ftd>\n        <td><span class=\"t-body\">Xử lý hợp đồng tín dụng thương mại. Khi công việc có khối lượng lớn và được mô tả tốt, AI thay được phần lớn lao động trí lực lặp lại.<\u002Fspan><\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td>\n          <span class=\"org\">Techcombank<\u002Fspan>\n          <span class=\"meta\">Ngân hàng · Việt Nam<\u002Fspan>\n        <\u002Ftd>\n        <td><span class=\"metric\">Hàng chục<\u002Fspan><span class=\"t-body\">quy trình cốt lõi chuẩn hoá trên nền tảng thống nhất<\u002Fspan><\u002Ftd>\n        <td><span class=\"t-body\">Cycle time và backlog đo được theo thời gian thực; tạo nền tảng để nhúng AI vào tín dụng bán lẻ và CSKH.<\u002Fspan><\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td>\n          <span class=\"org\">BiPlus × Atlassian<\u002Fspan>\n          <span class=\"meta\">Tư vấn · Việt Nam<\u002Fspan>\n        <\u002Ftd>\n        <td><span class=\"metric\">–60 đến –75%<\u002Fspan><span class=\"t-body\">thời gian handoff giữa các đội ITSM<\u002Fspan><\u002Ftd>\n        <td><span class=\"t-body\">Sau khi chuẩn hoá workflow và bổ sung AI assistant cho ITSM, khách hàng ghi nhận giảm handoff và tăng tốc độ giải quyết tickets.<\u002Fspan><\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td>\n          <span class=\"org\">Tập đoàn sản xuất VN<\u002Fspan>\n          <span class=\"meta\">Ẩn danh · Việt Nam<\u002Fspan>\n        <\u002Ftd>\n        <td><span class=\"metric\">68% → trên 90%<\u002Fspan><span class=\"t-body\">đơn hàng xử lý trong SLA 24 giờ<\u002Fspan><\u002Ftd>\n        <td><span class=\"t-body\">AI assistant trong quy trình xử lý đơn hàng và khiếu nại trên một nền tảng hội tụ — không thay con người, mà điều phối thông tin và rút handoff.<\u002Fspan><\u002Ftd>\n      <\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Bảy case study<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 21 — SECTION DIVIDER 05 — Checklist\n=================================================================== -->\n<section class=\"page section-page\" data-screen-label=\"21 Section 05\">\n  <div class=\"page-inner\">\n    <div>\n      <span class=\"sp-eyebrow\">Phần 05<\u002Fspan>\n      <div class=\"sp-num\">05<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h1 class=\"sp-title\">Checklist tự đánh giá cho CIO — bảy cổng kiểm soát và năm nhóm câu hỏi chiến lược.<\u002Fh1>\n      <p class=\"sp-sub\">Nếu một mục bất kỳ trả lời \"chưa\" — đừng phê duyệt ngân sách AI tiếp theo. Quay lại bước tương ứng trong khung hành động.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Section 05 · Checklist<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 22 — 7 control gates\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"22 Seven gates\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">05 Checklist <span class=\"sep\">·<\u002Fspan> Bảy cổng kiểm soát<\u002Fspan>\n    <span class=\"ph-page-num\">19<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Bảy cổng kiểm soát trước khi phê duyệt ngân sách AI tiếp theo.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 6mm; margin-bottom: 6mm;\">\n    Bảy câu hỏi dưới đây chưng cất Khung hành động tối thiểu thành các cổng kiểm soát mà CIO có thể áp dụng ngay trong quy trình phê duyệt ngân sách.\n  <\u002Fp>\n\n  <div>\n    <div class=\"check-row\">\n      <div class=\"check-box\"><\u002Fdiv>\n      <div>\n        <div class=\"check-title\">01 · Vấn đề ưu tiên<\u002Fdiv>\n        <div class=\"check-text\">Đã xác định một đến ba vấn đề kinh doanh và vận hành ưu tiên — với pain point và KPI hiện trạng rõ ràng — chưa?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"check-row\">\n      <div class=\"check-box\"><\u002Fdiv>\n      <div>\n        <div class=\"check-title\">02 · Mô hình hoá workflow<\u002Fdiv>\n        <div class=\"check-text\">Đã vẽ lại luồng as-is trên Work Platform với đầy đủ step, role, tool, rule — và chỉ ra điểm nghẽn cần xử lý — chưa?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"check-row\">\n      <div class=\"check-box\"><\u002Fdiv>\n      <div>\n        <div class=\"check-title\">03 · Dữ liệu và log<\u002Fdiv>\n        <div class=\"check-text\">Dữ liệu liên quan đã được hội tụ hoặc tích hợp lên Work Platform, có schema và audit trail rõ ràng chưa?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"check-row\">\n      <div class=\"check-box\"><\u002Fdiv>\n      <div>\n        <div class=\"check-title\">04 · KPI và OKR<\u002Fdiv>\n        <div class=\"check-text\">Đã chuyển mục tiêu thành KPI hoặc OKR đo được trực tiếp trên Work Platform — cycle time, SLA, NPS, adoption — chưa?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"check-row\">\n      <div class=\"check-box\"><\u002Fdiv>\n      <div>\n        <div class=\"check-title\">05 · Ownership và RACI<\u002Fdiv>\n        <div class=\"check-text\">Đã phân công rõ ai sở hữu quy trình, dữ liệu, policy AI — và phản ánh trực tiếp vào Work Platform — chưa?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"check-row\">\n      <div class=\"check-box\"><\u002Fdiv>\n      <div>\n        <div class=\"check-title\">06 · Governance và security<\u002Fdiv>\n        <div class=\"check-text\">Đã thiết kế guardrail, quyền truy cập, DLP, backup và compliance cho AI trên Work Platform chưa?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"check-row\">\n      <div class=\"check-box\"><\u002Fdiv>\n      <div>\n        <div class=\"check-title\">07 · Lộ trình pilot và scale<\u002Fdiv>\n        <div class=\"check-text\">Đã có kế hoạch pilot in-the-flow, đo lường liên tục và mở rộng dần theo domain chưa?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Bảy cổng kiểm soát<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 23 — 5 strategic question groups\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"23 Strategic questions\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">05 Checklist <span class=\"sep\">·<\u002Fspan> Năm nhóm câu hỏi chiến lược<\u002Fspan>\n    <span class=\"ph-page-num\">20<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Năm nhóm câu hỏi để CIO và C-level cùng soi lại System of Work.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 6mm; margin-bottom: 6mm;\">\n    Bên cạnh checklist thao tác, bộ câu hỏi dưới đây giúp soi toàn bộ System of Work ở cấp chiến lược — phù hợp cho phiên rà soát hàng quý cùng CEO, COO, CISO.\n  <\u002Fp>\n\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 5mm;\">\n    <div class=\"qgroup\">\n      <div class=\"qg-head\"><span class=\"qg-num\">01<\u002Fspan><span class=\"qg-title\">System of Work &amp; Work Platform<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>Công việc thực tế đã được ghi nhận và theo dõi trên một System of Work duy nhất chưa — hay vẫn nằm rải rác giữa nhiều tool?<\u002Fli>\n        <li>Bao nhiêu phần trăm công việc (tính theo giá trị hoặc giờ làm) đang chạy qua System of Work đó?<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div class=\"qgroup\">\n      <div class=\"qg-head\"><span class=\"qg-num\">02<\u002Fspan><span class=\"qg-title\">Process · Behaviour · Operating Model<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>Tổ chức đã thiết kế lại ba trụ cột cho kỷ nguyên AI — hay chỉ số hoá lại cách làm cũ?<\u002Fli>\n        <li>Hành vi sử dụng Work Platform có được đo lường và gắn KPI cho quản lý và team không?<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div class=\"qgroup\">\n      <div class=\"qg-head\"><span class=\"qg-num\">03<\u002Fspan><span class=\"qg-title\">Standardization vs. co-existence<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>Chiến lược tổng thể là hội tụ về một đến hai Work Platform chủ lực — hay chấp nhận co-existence có kỷ luật?<\u002Fli>\n        <li>Đã có integration và data governance xuyên suốt giữa các hệ thống cốt lõi với Work Platform chưa?<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div class=\"qgroup\">\n      <div class=\"qg-head\"><span class=\"qg-num\">04<\u002Fspan><span class=\"qg-title\">AI in-the-flow &amp; guardrail<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>AI hiện đang sống ở đâu — trên tool cá nhân rời rạc, hay đã được nhúng vào luồng công việc thật?<\u002Fli>\n        <li>Đã định nghĩa rõ guardrail và data governance cho AI trên System of Work chưa?<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div class=\"qgroup\" style=\"grid-column: span 2;\">\n      <div class=\"qg-head\"><span class=\"qg-num\">05<\u002Fspan><span class=\"qg-title\">Resilience &amp; compliance<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>Đã có cơ chế backup, phục hồi, retention và eDiscovery cho dữ liệu và log tương tác AI chưa?<\u002Fli>\n        <li>System of Work hiện tại đáp ứng các yêu cầu SOC 2, ISO 27001, GDPR, data residency ở mức nào?<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Năm nhóm câu hỏi chiến lược<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 24 — SECTION DIVIDER 06 — Hành động ngay tuần tới\n=================================================================== -->\n<section class=\"page section-page\" data-screen-label=\"24 Section 06\">\n  <div class=\"page-inner\">\n    <div>\n      <span class=\"sp-eyebrow\">Phần 06<\u002Fspan>\n      <div class=\"sp-num\">06<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h1 class=\"sp-title\">Năm bước CIO có thể khởi động ngay tuần tới — không cần phê duyệt ngân sách lớn.<\u002Fh1>\n      <p class=\"sp-sub\">Mỗi bước nằm trong 1–4 tuần. Sau 1–2 quý, đã có 1–2 minh chứng sống để thuyết phục C-level mở rộng chương trình.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Section 06 · Hành động<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 25 — Hình 8: 5 bước CIO\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"25 Hinh 8 Five actions\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">06 Hành động <span class=\"sep\">·<\u002Fspan> Hình 8<\u002Fspan>\n    <span class=\"ph-page-num\">21<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Năm bước CIO có thể khởi động ngay tuần tới.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 6mm; margin-bottom: 6mm;\">\n    Không bước nào cần phê duyệt ngân sách lớn. Tất cả đều có thể bắt đầu trong vòng một quý — và tạo ra dữ liệu để xin ngân sách lớn hơn cho giai đoạn sau.\n  <\u002Fp>\n\n  <div class=\"figure\">\n    <div class=\"vsteps\">\n      <div class=\"vstep\">\n        <div class=\"vs-num\">1<\u002Fdiv>\n        <div class=\"vs-body\">\n          <div class=\"vs-title\">Đánh giá hiện trạng System of Work<\u002Fdiv>\n          <div class=\"vs-detail\">Lập bản đồ tool, quy trình, dữ liệu, văn hoá. Ước lượng phần trăm công việc thực sự đang chạy qua một Work Platform nào đó — phần còn lại đang trôi nổi ngoài hệ thống.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vstep\">\n        <div class=\"vs-num\">2<\u002Fdiv>\n        <div class=\"vs-body\">\n          <div class=\"vs-title\">Chọn 1–2 use case và thiết kế lại workflow<\u002Fdiv>\n          <div class=\"vs-detail\">Domain có pain point rõ và sponsor có tên. Vẽ as-is và to-be trên Work Platform, khoanh vùng điểm có thể nhúng AI và automation.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vstep\">\n        <div class=\"vs-num\">3<\u002Fdiv>\n        <div class=\"vs-body\">\n          <div class=\"vs-title\">Đặt KPI/OKR rõ ràng — đo trước-sau trên nền tảng<\u002Fdiv>\n          <div class=\"vs-detail\">3–5 KPI: cycle time, SLA, backlog, tỷ lệ lỗi, NPS. Dashboard và log tự động — không báo cáo thủ công.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vstep\">\n        <div class=\"vs-num\">4<\u002Fdiv>\n        <div class=\"vs-body\">\n          <div class=\"vs-title\">Nhúng AI vào luồng công việc thật — chạy pilot rồi mở rộng<\u002Fdiv>\n          <div class=\"vs-detail\">Bắt đầu từ rủi ro thấp và ROI nhanh: Assistant, Knowledge &amp; Search, Recommendation. Human-in-the-loop và audit trail ngay từ đầu.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vstep\">\n        <div class=\"vs-num\">5<\u002Fdiv>\n        <div class=\"vs-body\">\n          <div class=\"vs-title\">Đầu tư change management và cộng đồng thực hành<\u002Fdiv>\n          <div class=\"vs-detail\">Bổ nhiệm digital/AI champion. Training, playbook, showcase quick wins. Adoption gắn vào KPI quản lý và team.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"vsteps-callout\">\n      Sau 1–2 quý: có 1–2 minh chứng sống để thuyết phục C-level mở rộng chương trình.\n    <\u002Fdiv>\n    <div class=\"figure-cap\">\n      <strong>Hình 8.<\u002Fstrong> Năm bước CIO có thể khởi động ngay tuần tới — không cần phê duyệt ngân sách lớn.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Hình 8 · Five next-week actions<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 26 — Closing thoughts\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"26 Closing\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">06 Hành động <span class=\"sep\">·<\u002Fspan> Kết luận<\u002Fspan>\n    <span class=\"ph-page-num\">22<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Lựa chọn của CIO hôm nay.<\u002Fh2>\n\n  <p class=\"lead-quote\">\n    Không có một Work Platform thống nhất, mọi cố gắng chuyển đổi AI sẽ chỉ tạo thêm các AI-fortified silos — những ốc đảo công nghệ được bơm AI nhưng không kết nối được với nhau, không đo được, không scale được.\n  <\u002Fp>\n\n  <div class=\"two-col\">\n    <div>\n      <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Chi phí của việc không hành động<\u002Fh3>\n      <p class=\"t-body\">\n        Không phải là giữ nguyên hiện trạng — mà là <strong>nợ vận hành<\u002Fstrong> và <strong>nợ dữ liệu<\u002Fstrong> tiếp tục tích luỹ với tốc độ nhanh hơn tốc độ kinh doanh. Mỗi quý chậm thiết kế lại System of Work là một quý các silo mới được dựng lên — và chi phí xử lý sau này sẽ lớn hơn rất nhiều.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Vai trò cốt lõi của CIO<\u002Fh3>\n      <p class=\"t-body\">\n        Không phải là người mua tool AI, mà là <strong>kiến trúc sư của System of Work<\u002Fstrong>. Nhiệm vụ gói gọn trong ba điểm: đảm bảo tổ chức có một Work Platform đủ tầm backbone, thiết kế ba trụ cột Process – Behaviour – Operating Model, và nhúng AI vào luồng có audit trail.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout-dark\" style=\"margin-top: 10mm;\">\n    Lựa chọn của CIO hôm nay: để tương lai System of Work tự hình thành theo cách ngẫu nhiên và phân mảnh — <em style=\"color: var(--biplus-yellow); font-style: normal;\">hay chủ động kiến trúc nó trên một AI-enabled Work Platform thống nhất.<\u002Fem>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: 12mm;\">\n    <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Nếu triển khai nghiêm túc<\u002Fh3>\n    <p class=\"t-body-lg\">\n      Chỉ sau một đến hai quý, CIO đã có một đến hai minh chứng sống về giá trị của AI-Enabled System of Work để thuyết phục C-level mở rộng chương trình. Đây không phải lý thuyết — đây là quy luật BiPlus đã quan sát thấy ở mọi chương trình thành công tại Việt Nam và khu vực.\n    <\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">BiPlus · Action Kit cho CIO<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 27 — Back cover\n=================================================================== -->\n<section class=\"page back-page\" data-screen-label=\"27 Back cover\">\n  <div class=\"page-inner\">\n    <div>\n      <span class=\"bk-eyebrow\">BiPlus · Transformation Consulting<\u002Fspan>\n    <\u002Fdiv>\n\n    <div>\n      <h2 class=\"bk-statement\">\n        Chúng tôi đồng hành cùng CIO trên <em>System of Work<\u002Fem> — từ kiến trúc đến vận hành, từ pilot đến scale.\n      <\u002Fh2>\n      <p class=\"bk-sign\" style=\"margin-top: 10mm;\">\n        BiPlus là Atlassian Platinum Solution Partner tại Việt Nam. Chúng tôi giúp các tổ chức doanh nghiệp lớn thiết kế, di trú và vận hành nền tảng cộng tác hiện đại — Jira, Confluence, Rovo AI agents — ở quy mô enterprise.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"back-card-contact\">\n      <div class=\"bcc-block\">\n        <span class=\"bcc-lbl\">Liên hệ chương trình<\u002Fspan>\n        <strong>Transformation Consulting Team<\u002Fstrong>\n        contact@biplus.com.vn<br>\n        +84 (0) 24 0000 0000\n      <\u002Fdiv>\n      <div class=\"bcc-block\">\n        <span class=\"bcc-lbl\">Atlassian Practice<\u002Fspan>\n        <strong>Platinum Solution Partner<\u002Fstrong>\n        Jira · Confluence · Jira Service Management<br>\n        Rovo AI Agents · Cloud Migration\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">© BiPlus · 2026 · v1.0<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<\u002Fbody><\u002Fhtml>"
