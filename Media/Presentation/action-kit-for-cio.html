  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"vi\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Action Kit cho CIO — AI-Enabled System of Work<\u002Ftitle>\n<style>/* ======================================================================\n   BiPlus — Colors & Type\n   The single source of truth for brand tokens.\n   Import this file before any other stylesheet:\n     <link rel=\"stylesheet\" href=\"colors_and_type.css\">\n   ====================================================================== */\n\n/* ───── Fonts ─────\n   Lexend → display / headlines (Bold 700 and heavier ONLY)\n   Manrope → body / UI / captions (Medium 500 and heavier ONLY)\n   Light, Thin, ExtraLight are FORBIDDEN in this brand. */\n@font-face {\n  font-family: 'Lexend';\n  src: url(\"f1ee6a33-ff18-45fb-a510-0f6c477a9d3c\") format('truetype-variations');\n  font-weight: 100 900;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Manrope';\n  src: url(\"382a13fa-ac50-4c68-a3d8-0fef1df0e854\") format('truetype-variations');\n  font-weight: 200 800;\n  font-display: swap;\n}\n\n:root {\n  /* ============================================================\n     CORE BRAND COLORS — 3 hero colors. Never invent new ones.\n     ============================================================ */\n\n  /* TechTonic Yellow — the iconic, energetic accent. CTAs, highlights. */\n  --biplus-yellow:        #EFC427;\n  --biplus-yellow-soft:   #F7DD7E;  /* mid-tone — highlights, chart fills  */\n  --biplus-yellow-pale:   #FFF6D6;  /* tinted fill for chips/cards   */\n  --biplus-yellow-tint:   #FFFBEA;  /* the lightest yellow surface   */\n  --biplus-yellow-dark:   #B8930F;  /* hover/pressed for yellow CTA  */\n\n  /* BiPlus Dark — sleek, modern, authoritative. The brand black. */\n  --biplus-dark:          #252929;\n  --biplus-dark-soft:     #3A3F3F;  /* secondary dark (callouts)     */\n  --biplus-dark-mute:     #5A6060;  /* tertiary dark text            */\n  --biplus-dark-faint:    #9A9E9E;  /* mid-gray — disabled, captions  */\n  --biplus-dark-pale:     #C8CCCC;  /* light cool gray — dividers, soft chips */\n  --biplus-dark-tint:     #ECEEEE;  /* near-white cool gray — page surfaces  */\n  --biplus-dark-wash:     #F5F7F7;  /* the lightest dark-family surface       */\n\n  /* BiPlus Blue — trust, tech, depth. USE SPARINGLY: links, data, icons. */\n  --biplus-blue:          #1868DB;\n  --biplus-blue-soft:     #B4D7FF;  /* mid-tint — backgrounds, soft chips  */\n  --biplus-blue-pale:     #E8F0FC;  /* tinted fill */\n  --biplus-blue-tint:     #F4F8FE;  /* lightest blue surface */\n  --biplus-blue-dark:     #0F4FA8;\n\n  /* Neutrals — a tight gray scale. Borders, backgrounds, body copy. */\n  --neutral-0:            #FFFFFF;\n  --neutral-50:           #FAFAFA;   /* page background tint           */\n  --neutral-100:          #F2F2F1;   /* card alt / table zebra         */\n  --neutral-200:          #E5E5E4;   /* default border, dividers       */\n  --neutral-300:          #CFCFCD;   /* strong border                  */\n  --neutral-500:          #8A8E8E;   /* muted / secondary text         */\n  --neutral-700:          #4A4F4F;   /* body text on light             */\n  --neutral-900:          #252929;   /* === biplus-dark, kept aliased  */\n\n  /* ============================================================\n     SEMANTIC TOKENS — reference these in components.\n     ============================================================ */\n\n  /* Surfaces */\n  --bg-page:              var(--neutral-50);\n  --bg-surface:           var(--neutral-0);\n  --bg-surface-alt:       var(--neutral-100);\n  --bg-inverse:           var(--biplus-dark);\n\n  /* Foregrounds */\n  --fg-default:           var(--biplus-dark);\n  --fg-muted:             var(--neutral-700);\n  --fg-faint:             var(--neutral-500);\n  --fg-on-yellow:         var(--biplus-dark);\n  --fg-on-dark:           var(--neutral-0);\n  --fg-on-blue:           var(--neutral-0);\n\n  /* Borders & dividers */\n  --border-default:       var(--neutral-200);\n  --border-strong:        var(--neutral-300);\n  --border-yellow:        var(--biplus-yellow);\n  --border-blue:          var(--biplus-blue);\n  --border-on-dark:       rgba(255, 255, 255, 0.10);\n\n  /* Accents */\n  --accent:               var(--biplus-yellow);\n  --accent-fg:            var(--biplus-dark);     /* text on yellow    */\n  --link:                 var(--biplus-blue);\n  --link-hover:           var(--biplus-blue-dark);\n\n  /* ============================================================\n     TYPE FAMILIES\n     ============================================================ */\n  --font-display:         'Lexend', 'Helvetica Neue', Arial, sans-serif;\n  --font-body:            'Manrope', 'Helvetica Neue', Arial, sans-serif;\n  --font-mono:            ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;\n\n  /* ============================================================\n     TYPE SCALE — slide-deck oriented (1280×720 / 1920×1080).\n     For UI mockups use the smaller end (h4/h5/body/caption).\n     ============================================================ */\n  --fs-display:  88px;    /* hero title-slide headline                 */\n  --fs-h1:       56px;    /* section opener                             */\n  --fs-h2:       40px;    /* slide title                                */\n  --fs-h3:       28px;    /* card title / pillar title                  */\n  --fs-h4:       20px;    /* sub-section                                */\n  --fs-h5:       16px;    /* UI heading / small card                    */\n  --fs-body-lg:  18px;    /* slide body                                 */\n  --fs-body:     15px;    /* default body / UI                          */\n  --fs-body-sm:  13px;    /* dense UI / captions                        */\n  --fs-caption:  11px;    /* footer, eyebrow, metadata                  */\n\n  --lh-tight:    1.10;\n  --lh-snug:     1.25;\n  --lh-normal:   1.45;\n  --lh-relaxed:  1.60;\n\n  --tracking-tight:  -0.02em;\n  --tracking-normal:  0em;\n  --tracking-wide:    0.04em;\n  --tracking-eyebrow: 0.18em;     /* uppercase eyebrows / footer       */\n\n  /* ============================================================\n     RADII — decisive: either rounded or sharp. No in-between fuzz.\n     ============================================================ */\n  --radius-sharp:    0px;\n  --radius-sm:       6px;     /* chips, tags, small buttons             */\n  --radius-md:       10px;    /* cards, inputs                          */\n  --radius-lg:       16px;    /* major containers, hero cards           */\n  --radius-pill:     999px;   /* pills only — used sparingly            */\n\n  /* ============================================================\n     SPACING SCALE (4px base)\n     ============================================================ */\n  --space-1:    4px;\n  --space-2:    8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   20px;\n  --space-6:   24px;\n  --space-8:   32px;\n  --space-10:  40px;\n  --space-12:  48px;\n  --space-16:  64px;\n  --space-20:  80px;\n\n  /* Slide geometry */\n  --slide-w:        1280px;\n  --slide-h:         720px;\n  --slide-pad-x:      72px;\n  --slide-pad-y:      56px;\n  --slide-footer-h:   72px;\n\n  /* ============================================================\n     BORDER WIDTHS — thin only. Heavy borders are off-brand.\n     ============================================================ */\n  --border-hair:   1px;\n  --border-thin:   1.5px;\n  --border-thick:  2px;     /* reserve for emphasis: selected/active   */\n\n  /* ============================================================\n     NO SHADOWS, NO GRADIENTS — by brand rule.\n     A single, very subtle separation shadow is provided\n     for paper cards on a page background. Use sparingly.\n     ============================================================ */\n  --shadow-card:   0 1px 0 var(--neutral-200);\n  --shadow-paper:  0 1px 2px rgba(37, 41, 41, 0.06);\n}\n\n/* =====================================================================\n   BASE / RESET\n   ===================================================================== */\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  background: var(--bg-page);\n  color: var(--fg-default);\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  font-weight: 500;                 /* Manrope Medium = minimum         */\n  line-height: var(--lh-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  font-feature-settings: \"ss01\", \"cv11\";\n}\n\n/* =====================================================================\n   SEMANTIC TYPE CLASSES — apply these directly in markup.\n     <h1 class=\"display\">…<\u002Fh1>\n     <h2 class=\"h2\">…<\u002Fh2>\n     <p class=\"body\">…<\u002Fp>\n     <span class=\"eyebrow\">01 · Section<\u002Fspan>\n   ===================================================================== */\n.display, .h1, .h2, .h3, .h4 {\n  font-family: var(--font-display);\n  font-weight: 700;                 /* Lexend Bold minimum              */\n  color: var(--fg-default);\n  letter-spacing: var(--tracking-tight);\n  line-height: var(--lh-tight);\n  margin: 0;\n}\n.display { font-size: var(--fs-display); font-weight: 800; }\n.h1      { font-size: var(--fs-h1);      font-weight: 800; }\n.h2      { font-size: var(--fs-h2);      font-weight: 800; line-height: var(--lh-snug); }\n.h3      { font-size: var(--fs-h3);      font-weight: 700; line-height: var(--lh-snug); }\n.h4      { font-size: var(--fs-h4);      font-weight: 700; line-height: var(--lh-snug); letter-spacing: 0; }\n.h5      {\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: var(--fs-h5);\n  line-height: var(--lh-snug);\n  letter-spacing: 0;\n}\n\n.body-lg { font-size: var(--fs-body-lg); line-height: var(--lh-relaxed); font-weight: 500; }\n.body    { font-size: var(--fs-body);    line-height: var(--lh-normal);  font-weight: 500; }\n.body-sm { font-size: var(--fs-body-sm); line-height: var(--lh-normal);  font-weight: 500; }\n.caption { font-size: var(--fs-caption); line-height: var(--lh-normal);  font-weight: 600; color: var(--fg-muted); }\n\n/* Eyebrow / section-number label — used on every content slide */\n.eyebrow {\n  font-family: var(--font-body);\n  font-size: var(--fs-caption);\n  font-weight: 700;\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  color: var(--fg-muted);\n}\n\n/* Decorative section number \"01\" \"02\" — large mono numeral */\n.section-num {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: var(--fs-h3);\n  color: var(--biplus-yellow);\n  letter-spacing: 0;\n  font-feature-settings: \"tnum\";\n}\n\na {\n  color: var(--link);\n  text-decoration: none;\n  border-bottom: 1px solid currentColor;\n  font-weight: 600;\n}\na:hover { color: var(--link-hover); }\n\nstrong, b { font-weight: 700; }\nem        { font-style: normal; font-weight: 700; color: var(--biplus-yellow-dark); }\n\n::selection { background: var(--biplus-yellow); color: var(--biplus-dark); }\n<\u002Fstyle>\n<style>/* ============================================================\n   BiPlus Playbook — A4 Portrait layout\n   ============================================================ */\n\n@page {\n  size: A4 portrait;\n  margin: 0;\n}\n\nhtml {\n  background: #cfcfcd;\n}\n\nbody {\n  font-family: var(--font-body);\n  color: var(--fg-default);\n  background: #cfcfcd;\n  margin: 0;\n  padding: 24px 0;\n  -webkit-print-color-adjust: exact;\n  print-color-adjust: exact;\n}\n\n@media print {\n  html, body { background: #fff; padding: 0; }\n}\n\n/* ───── A4 Page ───── */\n.page {\n  width: 210mm;\n  min-height: 297mm;\n  max-height: 297mm;\n  margin: 0 auto 16px;\n  background: #fff;\n  position: relative;\n  padding: 18mm 18mm 22mm;\n  overflow: hidden;\n  page-break-after: always;\n  break-after: page;\n}\n\n.page:last-child { page-break-after: auto; break-after: auto; margin-bottom: 0; }\n\n@media print {\n  .page { margin: 0; box-shadow: none; }\n  body { padding: 0; }\n}\n\n@media screen {\n  .page { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }\n}\n\n/* ───── Yellow corner square — wayfinding mark on every page ───── */\n.page::after {\n  content: \"\";\n  position: absolute;\n  top: 0;\n  right: 0;\n  width: 18mm;\n  height: 18mm;\n  background: var(--biplus-yellow);\n}\n\n/* ───── Page chrome: header + footer ───── */\n.ph-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding-bottom: 8mm;\n  border-bottom: 1px solid var(--neutral-200);\n  margin-bottom: 10mm;\n  position: relative;\n  z-index: 2;\n}\n\n.ph-eyebrow {\n  font-family: var(--font-body);\n  font-size: 9pt;\n  font-weight: 700;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--biplus-dark);\n}\n\n.ph-eyebrow .sep {\n  color: var(--biplus-yellow-dark);\n  margin: 0 6px;\n}\n\n.ph-page-num {\n  font-family: var(--font-body);\n  font-size: 9pt;\n  font-weight: 700;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--neutral-500);\n  margin-right: 22mm; /* clear the corner square */\n}\n\n.ph-footer {\n  position: absolute;\n  left: 18mm;\n  right: 18mm;\n  bottom: 10mm;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding-top: 6mm;\n  border-top: 1px solid var(--neutral-200);\n}\n\n.ph-footer .logos {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n}\n\n.ph-footer img.logo-biplus { height: 18px; width: auto; }\n.ph-footer img.logo-atlassian { height: 28px; width: auto; opacity: 0.85; }\n\n.ph-footer .ph-ref {\n  font-family: var(--font-body);\n  font-size: 8pt;\n  font-weight: 600;\n  color: var(--neutral-500);\n  letter-spacing: 0.04em;\n}\n\n/* ───── Typography ───── */\n.t-display {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 42pt;\n  line-height: 1.04;\n  letter-spacing: -0.02em;\n  color: var(--biplus-dark);\n}\n.t-h1 {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 26pt;\n  line-height: 1.14;\n  letter-spacing: -0.015em;\n  color: var(--biplus-dark);\n  margin: 0;\n}\n.t-h2 {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 19pt;\n  line-height: 1.18;\n  letter-spacing: -0.01em;\n  color: var(--biplus-dark);\n  margin: 0;\n}\n.t-h3 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 14pt;\n  line-height: 1.25;\n  color: var(--biplus-dark);\n  margin: 0;\n}\n.t-h4 {\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: 11pt;\n  letter-spacing: 0.02em;\n  color: var(--biplus-dark);\n  margin: 0;\n}\n.t-eyebrow {\n  font-family: var(--font-body);\n  font-size: 8.5pt;\n  font-weight: 700;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--biplus-dark-mute);\n}\n.t-deck {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 13pt;\n  line-height: 1.4;\n  color: var(--biplus-dark-soft);\n  font-style: italic;\n  letter-spacing: -0.005em;\n}\n.t-body {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: 10.5pt;\n  line-height: 1.55;\n  color: var(--neutral-700);\n}\n.t-body-lg {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: 11.5pt;\n  line-height: 1.55;\n  color: var(--neutral-700);\n}\n.t-body strong, .t-body-lg strong, li strong { color: var(--biplus-dark); font-weight: 700; }\n.t-cap {\n  font-family: var(--font-body);\n  font-weight: 600;\n  font-size: 9pt;\n  line-height: 1.5;\n  color: var(--neutral-500);\n  font-style: italic;\n}\n\n/* ───── Common content elements ───── */\n.section-title-block {\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n  margin-bottom: 8mm;\n}\n\n.section-title-block .t-eyebrow { margin-bottom: 4px; }\n\n.divider-thin { border: 0; border-top: 1px solid var(--neutral-200); margin: 6mm 0; }\n\n.kicker {\n  display: inline-block;\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: 9pt;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--biplus-dark);\n  background: var(--biplus-yellow);\n  padding: 4px 10px;\n  border-radius: 4px;\n}\n\n.tag-pill {\n  display: inline-block;\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: 8.5pt;\n  letter-spacing: 0.04em;\n  padding: 3px 9px;\n  border-radius: 4px;\n  background: var(--biplus-blue-pale);\n  color: var(--biplus-blue-dark);\n  border: 1px solid var(--biplus-blue);\n}\n.tag-pill.yellow {\n  background: var(--biplus-yellow-pale);\n  color: var(--biplus-dark);\n  border-color: var(--biplus-yellow);\n}\n.tag-pill.dark {\n  background: var(--biplus-dark);\n  color: var(--biplus-yellow);\n  border-color: var(--biplus-dark);\n}\n.tag-pill.muted {\n  background: var(--biplus-dark-wash);\n  color: var(--biplus-dark);\n  border-color: var(--neutral-300);\n}\n\n/* ───── List styling ───── */\nul.bp-list, ol.bp-list {\n  list-style: none;\n  padding: 0;\n  margin: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\nul.bp-list li, ol.bp-list li {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: 10.5pt;\n  line-height: 1.5;\n  color: var(--neutral-700);\n  padding-left: 22px;\n  position: relative;\n}\nul.bp-list li::before {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  top: 8px;\n  width: 8px;\n  height: 8px;\n  background: var(--biplus-yellow);\n}\nol.bp-list { counter-reset: bp-counter; }\nol.bp-list li { counter-increment: bp-counter; padding-left: 32px; }\nol.bp-list li::before {\n  content: counter(bp-counter, decimal-leading-zero);\n  position: absolute;\n  left: 0;\n  top: 1px;\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 11pt;\n  color: var(--biplus-yellow-dark);\n  letter-spacing: 0;\n}\n\n/* ───── Cards ───── */\n.card {\n  background: var(--neutral-0);\n  border: 1px solid var(--neutral-200);\n  border-radius: 10px;\n  padding: 14px 16px;\n}\n.card.tint { background: var(--biplus-dark-wash); }\n.card.yellow { background: var(--biplus-yellow-pale); border-color: var(--biplus-yellow); }\n.card.blue { background: var(--biplus-blue-pale); border-color: var(--biplus-blue); }\n.card.dark { background: var(--biplus-dark); border-color: var(--biplus-dark); color: var(--neutral-0); }\n.card.dark .t-h3, .card.dark .t-h4 { color: var(--neutral-0); }\n.card.dark .t-body, .card.dark .t-cap { color: rgba(255,255,255,0.78); }\n\n.callout-yellow {\n  background: var(--biplus-yellow);\n  color: var(--biplus-dark);\n  padding: 10px 16px;\n  border-radius: 4px;\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: 11pt;\n  letter-spacing: 0.005em;\n  text-align: center;\n}\n\n.callout-dark {\n  background: var(--biplus-dark);\n  color: var(--biplus-yellow);\n  padding: 14px 18px;\n  border-radius: 6px;\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 12pt;\n  letter-spacing: -0.005em;\n  text-align: center;\n}\n\n/* ───── Cover ───── */\n.cover .page-inner {\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n  padding-top: 4mm;\n}\n\n.cover .cover-eyebrow {\n  font-family: var(--font-body);\n  font-weight: 800;\n  font-size: 11pt;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  color: var(--biplus-dark);\n}\n\n.cover .cover-title {\n  font-family: var(--font-display);\n  font-weight: 900;\n  font-size: 54pt;\n  line-height: 1.0;\n  letter-spacing: -0.025em;\n  color: var(--biplus-dark);\n}\n.cover .cover-title .accent { color: var(--biplus-yellow-dark); }\n\n.cover .cover-sub {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 20pt;\n  line-height: 1.25;\n  color: var(--biplus-dark-soft);\n  letter-spacing: -0.01em;\n  font-style: italic;\n}\n\n.cover-meta {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-end;\n}\n\n.cover-meta-block {\n  font-family: var(--font-body);\n  font-size: 9pt;\n  font-weight: 600;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--neutral-500);\n}\n.cover-meta-block strong {\n  display: block;\n  color: var(--biplus-dark);\n  font-size: 10.5pt;\n  letter-spacing: 0.12em;\n  margin-top: 2px;\n}\n\n.cover-rule {\n  width: 60mm;\n  height: 4px;\n  background: var(--biplus-yellow);\n  margin-top: 16px;\n  margin-bottom: 32px;\n}\n\n/* ───── Section divider page ───── */\n.section-page {\n  background: var(--biplus-dark);\n  color: var(--neutral-0);\n}\n.section-page::after { background: var(--biplus-yellow); } /* corner stays */\n.section-page .page-inner {\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n}\n.section-page .sp-eyebrow {\n  font-family: var(--font-body);\n  font-weight: 800;\n  font-size: 10pt;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  color: var(--biplus-yellow);\n}\n.section-page .sp-num {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 120pt;\n  line-height: 0.9;\n  color: var(--biplus-yellow);\n  letter-spacing: -0.04em;\n}\n.section-page .sp-title {\n  font-family: var(--font-display);\n  font-weight: 900;\n  font-size: 38pt;\n  line-height: 1.06;\n  letter-spacing: -0.02em;\n  color: var(--neutral-0);\n  margin-top: 8mm;\n  max-width: 150mm;\n}\n.section-page .sp-sub {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 14pt;\n  line-height: 1.35;\n  color: rgba(255,255,255,0.78);\n  font-style: italic;\n  max-width: 140mm;\n  margin-top: 6mm;\n}\n.section-page .ph-footer { border-top-color: rgba(255,255,255,0.15); }\n.section-page .ph-footer .ph-ref { color: rgba(255,255,255,0.6); }\n.section-page .ph-footer img.logo-biplus,\n.section-page .ph-footer img.logo-atlassian { filter: brightness(0) invert(1); opacity: 0.95; }\n\n/* ───── Figure block ───── */\n.figure {\n  border: 1px solid var(--neutral-200) blue) */\n  top: 8%; left: 60%;\n  border: 2px solid var(--biplus-blue);\n  background: var(--biplus-blue-pale);\n}\n.q-tr .q-name { color: var(--biplus-blue-dark); }\n.q-bl { /* bottom left - Recommendation (yellow) */\n  top: 55%; left: 25%;\n  border: 2px solid var(--biplus-yellow-dark);\n  background: var(--biplus-yellow-pale);\n}\n.q-bl .q-name { color: var(--biplus-yellow-dark); }\n.q-br { /* bottom right - Automation (red) */\n  top: 55%; left: 65%;\n  border: 2px solid #C04040;\n  background: #FCEEEE;\n}\n.q-br .q-name { color: #B22D2D; }\n\n.matrix-axis-marker {\n  position: absolute;\n  font-family: var(--font-body);\n  font-size: 8pt;\n  font-weight: 700;\n  color: var(--biplus-dark-mute);\n  font-style: italic;\n}\n.matrix-axis-marker.start-good {\n  top: 36%; left: 8%; color: #2E7D4F;\n}\n.matrix-axis-marker.high-roi {\n  top: 36%; right: 6%; color: var(--biplus-blue-dark);\n}\n.matrix-yaxis-top, .matrix-yaxis-bot {\n  font-family: var(--font-body);\n  font-size: 9pt;\n  font-weight: 700;\n}\n.matrix-xaxis {\n  grid-column: 2;\n  text-align: center;\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: 9pt;\n  color: var(--biplus-dark);\n  position: relative;\n  padding-top: 4px;\n}\n.matrix-xaxis .mx-low { position: absolute; left: 2%; top: 4px; font-weight: 700; }\n.matrix-xaxis .mx-high { position: absolute; right: 2%; top: 4px; font-weight: 700; }\n.matrix-empty { grid-column: 1; }\n\n/* ───── Figure: 5 numbered horizontal steps (Hinh-8) ───── */\n.vsteps { display: flex; flex-direction: column; gap: 6px; }\n.vstep {\n  display: grid;\n  grid-template-columns: 28px 1fr;\n  gap: 14px;\n  align-items: stretch;\n}\n.vstep .vs-num {\n  background: var(--biplus-blue-dark);\n  color: var(--neutral-0);\n  border-radius: 50%;\n  width: 26px;\n  height: 26px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 12pt;\n  margin-top: 8px;\n}\n.vstep .vs-body {\n  background: var(--biplus-blue-pale);\n  border: 1px solid var(--biplus-blue-soft);\n  border-radius: 8px;\n  padding: 10px 14px;\n}\n.vstep .vs-title {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 12pt;\n  color: var(--biplus-blue-dark);\n  letter-spacing: -0.005em;\n}\n.vstep .vs-detail {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: 9.5pt;\n  line-height: 1.45;\n  color: var(--neutral-700);\n  margin-top: 4px;\n}\n.vsteps-callout {\n  background: var(--biplus-yellow-pale);\n  border: 1px solid var(--biplus-yellow);\n  border-radius: 6px;\n  padding: 10px 14px;\n  text-align: center;\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: 10pt;\n  color: var(--biplus-dark);\n  margin-top: 8px;\n}\n\n/* ───── Tables / case study ───── */\n.case-table {\n  width: 100%;\n  border-collapse: collapse;\n  margin-top: 6px;\n}\n.case-table th, .case-table td {\n  text-align: left;\n  vertical-align: top;\n  padding: 7px 10px;\n  font-family: var(--font-body);\n  font-size: 9pt;\n  line-height: 1.35;\n  border-bottom: 1px solid var(--neutral-200);\n}\n.case-table th {\n  font-weight: 800;\n  font-size: 8pt;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--biplus-dark);\n  background: var(--biplus-dark-wash);\n  border-bottom: 1.5px solid var(--biplus-dark);\n}\n.case-table td .org {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 10pt;\n  color: var(--biplus-dark);\n  display: block;\n  margin-bottom: 1px;\n}\n.case-table td .meta {\n  font-family: var(--font-body);\n  font-weight: 600;\n  font-size: 7.5pt;\n  color: var(--neutral-500);\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n}\n.case-table td .metric {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 11pt;\n  color: var(--biplus-yellow-dark);\n  display: block;\n  margin-bottom: 1px;\n}\n.case-table tr:last-child td { border-bottom: none; }\n\n/* ───── KPI mapping table ───── */\n.kpi-grid {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 6px;\n}\n.kpi-row {\n  display: grid;\n  grid-template-columns: 1.1fr 1fr 1.1fr;\n  border: 1px solid var(--neutral-200);\n  border-radius: 8px;\n  overflow: hidden;\n}\n.kpi-row .kr-cell { padding: 7px 11px; }\n.kpi-row .kr-goal {\n  background: var(--biplus-yellow-pale);\n  border-right: 1px solid var(--biplus-yellow);\n}\n.kpi-row .kr-kpi {\n  background: var(--biplus-dark-wash);\n  border-right: 1px solid var(--neutral-200);\n}\n.kpi-row .kr-case {\n  background: var(--biplus-blue-pale);\n}\n.kpi-row .kr-lbl {\n  font-family: var(--font-body);\n  font-weight: 800;\n  font-size: 7.5pt;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--biplus-dark-mute);\n  margin-bottom: 2px;\n}\n.kpi-row .kr-title {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 9.5pt;\n  color: var(--biplus-dark);\n  line-height: 1.2;\n  margin-bottom: 3px;\n}\n.kpi-row .kr-text {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: 8.5pt;\n  color: var(--neutral-700);\n  line-height: 1.35;\n}\n.kpi-row .kr-case .kr-text strong {\n  color: var(--biplus-blue-dark);\n}\n\n/* ───── Pull quote / opening lead ───── */\n.lead-quote {\n  border-left: 4px solid var(--biplus-yellow);\n  padding: 6px 0 6px 16px;\n  margin: 14px 0 16px;\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 13.5pt;\n  line-height: 1.35;\n  color: var(--biplus-dark);\n  font-style: italic;\n  letter-spacing: -0.005em;\n}\n\n/* ───── Two column layout ───── */\n.two-col {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 8mm;\n}\n.two-col.narrow-left { grid-template-columns: 0.85fr 1.15fr; }\n.two-col.narrow-right { grid-template-columns: 1.15fr 0.85fr; }\n\n/* ───── Example callout card ───── */\n.example-card {\n  background: var(--biplus-dark-wash);\n  border-left: 4px solid var(--biplus-dark);\n  border-radius: 0 6px 6px 0;\n  padding: 12px 14px;\n}\n.example-card .ex-eyebrow {\n  font-family: var(--font-body);\n  font-weight: 800;\n  font-size: 8pt;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--biplus-yellow-dark);\n  margin-bottom: 3px;\n}\n.example-card .ex-title {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 11pt;\n  color: var(--biplus-dark);\n  margin-bottom: 6px;\n}\n.example-card .ex-body {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: 10pt;\n  line-height: 1.5;\n  color: var(--neutral-700);\n}\n\n/* ───── Checklist row ───── */\n.check-row {\n  display: grid;\n  grid-template-columns: 26px 1fr;\n  gap: 10px;\n  padding: 10px 12px;\n  border: 1px solid var(--neutral-200);\n  border-radius: 8px;\n  background: var(--neutral-0);\n  align-items: start;\n}\n.check-row + .check-row { margin-top: 8px; }\n.check-row .check-box {\n  width: 18px; height: 18px;\n  border: 1.5px solid var(--biplus-dark);\n  border-radius: 4px;\n  margin-top: 2px;\n}\n.check-row .check-title {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 10pt;\n  color: var(--biplus-dark);\n  letter-spacing: -0.005em;\n}\n.check-row .check-text {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: 9.5pt;\n  line-height: 1.45;\n  color: var(--neutral-700);\n  margin-top: 2px;\n}\n\n/* ───── Strategic question group ───── */\n.qgroup {\n  border: 1px solid var(--neutral-200);\n  border-radius: 8px;\n  padding: 12px 14px 14px;\n  background: var(--neutral-0);\n}\n.qgroup .qg-head {\n  display: flex;\n  align-items: baseline;\n  gap: 10px;\n  margin-bottom: 8px;\n}\n.qgroup .qg-num {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 14pt;\n  color: var(--biplus-yellow-dark);\n  letter-spacing: 0;\n}\n.qgroup .qg-title {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 12pt;\n  color: var(--biplus-dark);\n  letter-spacing: -0.005em;\n}\n.qgroup ul {\n  list-style: none; padding: 0; margin: 0;\n  display: flex; flex-direction: column; gap: 6px;\n}\n.qgroup ul li {\n  font-family: var(--font-body);\n  font-size: 9.5pt;\n  font-weight: 500;\n  line-height: 1.45;\n  color: var(--neutral-700);\n  padding-left: 16px;\n  position: relative;\n}\n.qgroup ul li::before {\n  content: \"?\";\n  position: absolute;\n  left: 0; top: 0;\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 11pt;\n  color: var(--biplus-yellow-dark);\n  line-height: 1;\n}\n\n/* ───── Toc / index ───── */\n.toc-list { display: flex; flex-direction: column; gap: 4px; }\n.toc-row {\n  display: grid;\n  grid-template-columns: 28px 1fr 36px;\n  align-items: baseline;\n  gap: 10px;\n  padding: 10px 0;\n  border-bottom: 1px dashed var(--neutral-200);\n}\n.toc-row .toc-num {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 11pt;\n  color: var(--biplus-yellow-dark);\n}\n.toc-row .toc-title {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 12pt;\n  color: var(--biplus-dark);\n  letter-spacing: -0.005em;\n}\n.toc-row .toc-title .toc-sub {\n  display: block;\n  font-family: var(--font-body);\n  font-size: 9pt;\n  font-weight: 500;\n  color: var(--neutral-500);\n  font-style: italic;\n  margin-top: 2px;\n}\n.toc-row .toc-pg {\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: 10pt;\n  color: var(--biplus-dark-mute);\n  text-align: right;\n  letter-spacing: 0.08em;\n}\n\n/* ───── Final back cover ───── */\n.back-page {\n  background: var(--biplus-dark);\n  color: var(--neutral-0);\n}\n.back-page::after { background: var(--biplus-yellow); }\n.back-page .page-inner {\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n}\n.back-page .bk-eyebrow {\n  font-family: var(--font-body);\n  font-weight: 800;\n  font-size: 10pt;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  color: var(--biplus-yellow);\n}\n.back-page .bk-statement {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 30pt;\n  line-height: 1.12;\n  letter-spacing: -0.015em;\n  color: var(--neutral-0);\n  max-width: 150mm;\n}\n.back-page .bk-statement em {\n  color: var(--biplus-yellow);\n  font-style: normal;\n  font-weight: 800;\n}\n.back-page .bk-sign {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 13pt;\n  color: rgba(255,255,255,0.78);\n  font-style: italic;\n  max-width: 140mm;\n}\n.back-page .ph-footer { border-top-color: rgba(255,255,255,0.15); }\n.back-page .ph-footer .ph-ref { color: rgba(255,255,255,0.6); }\n.back-page .ph-footer img.logo-biplus,\n.back-page .ph-footer img.logo-atlassian { filter: brightness(0) invert(1); opacity: 0.95; }\n\n.back-card-contact {\n  background: rgba(255,255,255,0.05);\n  border: 1px solid rgba(255,255,255,0.18);\n  border-radius: 10px;\n  padding: 16px 20px;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 8mm 16mm;\n}\n.back-card-contact .bcc-block {\n  font-family: var(--font-body);\n  font-size: 9.5pt;\n  color: rgba(255,255,255,0.78);\n  font-weight: 500;\n  line-height: 1.5;\n}\n.back-card-contact .bcc-lbl {\n  font-family: var(--font-body);\n  font-weight: 800;\n  font-size: 8.5pt;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--biplus-yellow);\n  display: block;\n  margin-bottom: 4px;\n}\n.back-card-contact .bcc-block strong {\n  display: block;\n  color: var(--neutral-0);\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 11.5pt;\n  letter-spacing: -0.005em;\n  margin-bottom: 2px;\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<!-- ===================================================================\n     PAGE 01 — COVER\n=================================================================== -->\n<section class=\"page cover\" data-screen-label=\"01 Cover\">\n  <div class=\"page-inner\">\n    <div>\n      <div class=\"cover-eyebrow\">Action Kit · CIO Edition · 2026<\u002Fdiv>\n      <div class=\"cover-rule\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <h1 class=\"cover-title\">\n        AI-Enabled<br>\n        <span class=\"accent\">System of Work<\u002Fspan>\n      <\u002Fh1>\n      <p class=\"cover-sub\" style=\"margin-top: 20px;\">\n        Khung hành động tối thiểu cho CIO để<br>\n        giảm rủi ro và tăng ROI khi triển khai AI<br>\n        trên một Work Platform thống nhất.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"cover-meta\">\n      <div class=\"cover-meta-block\">\n        Prepared by\n        <strong>BiPlus — Transformation Consulting<\u002Fstrong>\n      <\u002Fdiv>\n      <div class=\"cover-meta-block\" style=\"text-align: right;\">\n        Atlassian Platinum<br>\n        <strong>Solution Partner · Vietnam<\u002Fstrong>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Playbook · v1.0 · 19 pages<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 02 — Mục lục\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"02 Mục lục\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">Action Kit cho CIO <span class=\"sep\">·<\u002Fspan> Mục lục<\u002Fspan>\n    <span class=\"ph-page-num\">02<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\" style=\"margin-bottom: 4mm;\">Nội dung playbook<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-bottom: 10mm;\">\n    Tài liệu này có thể đọc tuyến tính từ đầu đến cuối, hoặc dùng như một bộ công cụ để mở vào từng phần khi cần ra quyết định.\n  <\u002Fp>\n\n  <div class=\"toc-list\">\n    <div class=\"toc-row\">\n      <span class=\"toc-num\">01<\u002Fspan>\n      <span class=\"toc-title\">Khởi điểm\n        <span class=\"toc-sub\">Vì sao phải kiến trúc Work Platform trước khi đầu tư thêm AI<\u002Fspan>\n      <\u002Fspan>\n      <span class=\"toc-pg\">p. 04<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"toc-row\">\n      <span class=\"toc-num\">02<\u002Fspan>\n      <span class=\"toc-title\">Khung hành động tối thiểu\n        <span class=\"toc-sub\">Năm bước bắt buộc trước khi chi thêm cho AI<\u002Fspan>\n      <\u002Fspan>\n      <span class=\"toc-pg\">p. 08<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"toc-row\">\n      <span class=\"toc-num\">03<\u002Fspan>\n      <span class=\"toc-title\">Lộ trình triển khai\n        <span class=\"toc-sub\">Từ pilot kiểm soát rủi ro đến scale có thể đo được<\u002Fspan>\n      <\u002Fspan>\n      <span class=\"toc-pg\">p. 15<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"toc-row\">\n      <span class=\"toc-num\">04<\u002Fspan>\n      <span class=\"toc-title\">Case study có con số cụ thể\n        <span class=\"toc-sub\">Bảy ví dụ Việt Nam và quốc tế đã công bố<\u002Fspan>\n      <\u002Fspan>\n      <span class=\"toc-pg\">p. 19<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"toc-row\">\n      <span class=\"toc-num\">05<\u002Fspan>\n      <span class=\"toc-title\">Checklist tự đánh giá cho CIO\n        <span class=\"toc-sub\">Bảy cổng kiểm soát + năm nhóm câu hỏi chiến lược<\u002Fspan>\n      <\u002Fspan>\n      <span class=\"toc-pg\">p. 21<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"toc-row\">\n      <span class=\"toc-num\">06<\u002Fspan>\n      <span class=\"toc-title\">Hành động ngay tuần tới\n        <span class=\"toc-sub\">Năm bước CIO có thể khởi động mà không cần ngân sách lớn<\u002Fspan>\n      <\u002Fspan>\n      <span class=\"toc-pg\">p. 23<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">BiPlus · Action Kit cho CIO<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 03 — SECTION DIVIDER 01\n=================================================================== -->\n<section class=\"page section-page\" data-screen-label=\"03 Section 01\">\n  <div class=\"page-inner\">\n    <div>\n      <span class=\"sp-eyebrow\">Phần 01<\u002Fspan>\n      <div class=\"sp-num\">01<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h1 class=\"sp-title\">Khởi điểm: vì sao trước khi đầu tư thêm cho AI, CIO phải kiến trúc Work Platform.<\u002Fh1>\n      <p class=\"sp-sub\">Nếu CIO không chủ động thiết kế System of Work cho tổ chức, nó vẫn sẽ hình thành — nhưng dưới dạng ngẫu nhiên, phân mảnh và đầy rủi ro.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Section 01 · Khởi điểm<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 04 — Ba ý chính\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"04 Ba ý chính\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">01 Khởi điểm <span class=\"sep\">·<\u002Fspan> Ba ý chính<\u002Fspan>\n    <span class=\"ph-page-num\">04<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Ba ý chính cần nắm trước khi bước vào phần hành động.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 5mm;\">\n    Phần lớn sáng kiến AI trong doanh nghiệp Việt Nam hiện nay mang lại cảm giác đổi mới nhưng không dịch chuyển được chỉ số vận hành cốt lõi. Ba luận điểm dưới đây giải thích vì sao.\n  <\u002Fp>\n\n  <div style=\"display: flex; flex-direction: column; gap: 5mm; margin-top: 7mm;\">\n    <div class=\"two-col narrow-left\" style=\"gap: 6mm; align-items: start;\">\n      <div>\n        <div class=\"kicker\">Ý 01<\u002Fdiv>\n        <h3 class=\"t-h2\" style=\"margin-top: 6px; font-size: 16pt;\">Work Platform là backbone vận hành, không phải công cụ quản lý task.<\u002Fh3>\n      <\u002Fdiv>\n      <p class=\"t-body\" style=\"font-size: 10pt;\">\n        Nó thống nhất sáu lớp từ <strong>Work Hub<\u002Fstrong> đến <strong>Governance<\u002Fstrong>, tạo một mô hình dữ liệu và quyền truy cập chung cho cả tổ chức. AI chỉ phát huy giá trị khi sống trong nền tảng này — không phải khi gắn rời rạc bên cạnh công cụ cũ.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <hr class=\"divider-thin\" style=\"margin: 2mm 0;\">\n\n    <div class=\"two-col narrow-left\" style=\"gap: 6mm; align-items: start;\">\n      <div>\n        <div class=\"kicker\">Ý 02<\u002Fdiv>\n        <h3 class=\"t-h2\" style=\"margin-top: 6px; font-size: 16pt;\">Tool AI rời rạc tạo <em>faster way of working<\u002Fem>. Work Platform + AI tạo <em>new way of working<\u002Fem>.<\u002Fh3>\n      <\u002Fdiv>\n      <p class=\"t-body\" style=\"font-size: 10pt;\">\n        Tool AI rời rạc làm từng cá nhân nhanh hơn nhưng dựng lên silo thông minh hơn — vẫn là silo. Work Platform kết hợp AI làm cả luồng công việc thay đổi, có audit trail xuyên suốt, có ROI đo được và tích lũy giá trị theo thời gian.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <hr class=\"divider-thin\" style=\"margin: 2mm 0;\">\n\n    <div class=\"two-col narrow-left\" style=\"gap: 6mm; align-items: start;\">\n      <div>\n        <div class=\"kicker\">Ý 03<\u002Fdiv>\n        <h3 class=\"t-h2\" style=\"margin-top: 6px; font-size: 16pt;\">AI là tầng gia tốc, không thay thế thiết kế vận hành.<\u002Fh3>\n      <\u002Fdiv>\n      <p class=\"t-body\" style=\"font-size: 10pt;\">\n        AI nằm phía trên ba trụ cột <strong>Process · Behaviour · Operating Model<\u002Fstrong>. Nếu ba trụ cột chưa được thiết kế tốt, AI sẽ ăn vào dữ liệu sai và khuếch đại hỗn loạn — biến quy trình kém thành quy trình kém với tốc độ cao hơn.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout-yellow\" style=\"margin-top: 7mm; font-size: 10pt; padding: 8px 14px;\">\n    Ba ý chính này — kiến trúc, lợi thế nền tảng, vị trí của AI — chính là ba câu hỏi mà mọi đề xuất AI tiếp theo phải trả lời được.\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">BiPlus · Action Kit cho CIO<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 05 — Hình 1: Kiến trúc 6 lớp Work Platform\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"05 Hinh 1 Architecture\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">01 Khởi điểm <span class=\"sep\">·<\u002Fspan> Hình 1<\u002Fspan>\n    <span class=\"ph-page-num\">05<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Kiến trúc Work Platform — sáu lớp vận hành đan chặt.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 6mm; margin-bottom: 8mm;\">\n    AI Layer chỉ phát huy giá trị khi cả năm lớp còn lại đã vững. Hiểu được sáu lớp này là điều kiện tối thiểu để CIO ra quyết định kiến trúc.\n  <\u002Fp>\n\n  <div class=\"figure\">\n    <div class=\"arch-stack\">\n      <div class=\"arch-layer\">\n        <div class=\"al-name\">Experience Layer<\u002Fdiv>\n        <div class=\"al-detail\">Giao diện thống nhất qua web, mobile, desktop, IDE, chat<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-layer ai\">\n        <div class=\"al-name\">AI Layer<\u002Fdiv>\n        <div class=\"al-detail\">Assistant <span style=\"color: var(--biplus-yellow-dark);\">·<\u002Fspan> Automation <span style=\"color: var(--biplus-yellow-dark);\">·<\u002Fspan> Recommendation <span style=\"color: var(--biplus-yellow-dark);\">·<\u002Fspan> Semantic Search<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-layer\">\n        <div class=\"al-name\">Governance Layer<\u002Fdiv>\n        <div class=\"al-detail\">RBAC / ABAC · Audit trail · DLP · Data residency · eDiscovery<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-layer\">\n        <div class=\"al-name\">Workflow Layer<\u002Fdiv>\n        <div class=\"al-detail\">ITSM · Change · Approval · SLA rule · Escalation logic<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-layer\">\n        <div class=\"al-name\">Data Layer<\u002Fdiv>\n        <div class=\"al-detail\">Schema chung · Activity log · Metadata · Taxonomy · Teamwork graph<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-layer\">\n        <div class=\"al-name\">Work Hub<\u002Fdiv>\n        <div class=\"al-detail\">Task · Ticket · Project · Chat · Docs · Meeting notes (kết nối trong cùng workspace)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"figure-cap\">\n      <strong>Hình 1.<\u002Fstrong> Kiến trúc sáu lớp của một Work Platform đủ tầm backbone. AI layer (vàng) chỉ phát huy giá trị khi năm lớp còn lại đã đủ vững.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"two-col\" style=\"margin-top: 8mm;\">\n    <div class=\"card tint\">\n      <div class=\"t-h4\" style=\"margin-bottom: 4px;\">Đọc kiến trúc này theo chiều dọc<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        Mỗi lớp phụ thuộc vào lớp ngay dưới: AI cần Governance để giữ kỷ luật truy cập, Governance cần Workflow để có trạng thái, Workflow cần Data Layer để có sự thật, Data Layer cần Work Hub để có dữ liệu sống.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card tint\">\n      <div class=\"t-h4\" style=\"margin-bottom: 4px;\">Sai lầm thường gặp<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        Mua AI Layer trước khi có Data Layer và Workflow Layer ổn định. Kết quả: AI thông minh hơn từng cá nhân, nhưng cả tổ chức vẫn chậm — vì dữ liệu sai, quyền lộn xộn, không ai biết audit trail nằm ở đâu.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Hình 1 · Work Platform architecture<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 06 — Hình 2: Hai cách đưa AI vào tổ chức\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"06 Hinh 2 Two paths\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">01 Khởi điểm <span class=\"sep\">·<\u002Fspan> Hình 2<\u002Fspan>\n    <span class=\"ph-page-num\">06<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Hai cách đưa AI vào tổ chức — kết quả hoàn toàn khác nhau.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 6mm; margin-bottom: 6mm;\">\n    Bên trái tạo ra nợ vận hành dài hạn. Bên phải tạo ra operating fabric có khả năng tích lũy giá trị.\n  <\u002Fp>\n\n  <div class=\"figure\" style=\"padding: 14px 14px 12px;\">\n    <div class=\"two-paths\">\n      <!-- BAD PATH -->\n      <div class=\"path-card bad\">\n        <div class=\"pc-title\">Tool AI rời rạc<\u002Fdiv>\n        <div class=\"pc-sub\">faster way of working<\u002Fdiv>\n\n        <div class=\"scatter-bubbles\">\n          <div class=\"bubble\" style=\"top: 0; left: 6%;\">Chat<span class=\"plus\">+ AI<\u002Fspan><\u002Fdiv>\n          <div class=\"bubble\" style=\"top: 0; left: 39%;\">Email<span class=\"plus\">+ AI<\u002Fspan><\u002Fdiv>\n          <div class=\"bubble\" style=\"top: 4%; left: 70%;\">Excel<span class=\"plus\">+ AI<\u002Fspan><\u002Fdiv>\n          <div class=\"bubble\" style=\"bottom: 0; left: 6%;\">CRM<span class=\"plus\">+ AI<\u002Fspan><\u002Fdiv>\n          <div class=\"bubble\" style=\"bottom: 0; left: 39%;\">ITSM<span class=\"plus\">+ AI<\u002Fspan><\u002Fdiv>\n          <div class=\"bubble\" style=\"bottom: 0; left: 70%;\">PM&nbsp;Tool<span class=\"plus\">+ AI<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"pc-result-title\">Hệ quả<\u002Fdiv>\n        <ul class=\"pc-result-list\">\n          <li>AI-fortified silos — mỗi silo thông minh hơn<\u002Fli>\n          <li>Không có audit trail xuyên suốt<\u002Fli>\n          <li>Không đo được ROI thật<\u002Fli>\n          <li>Không scale được<\u002Fli>\n        <\u002Ful>\n        <div class=\"pc-footer-note\">Wow effect ngắn hạn → nợ vận hành dài hạn<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"path-arrow\">→<\u002Fdiv>\n\n      <!-- GOOD PATH -->\n      <div class=\"path-card good\">\n        <div class=\"pc-title\">Work Platform + AI<\u002Fdiv>\n        <div class=\"pc-sub\">new way of working<\u002Fdiv>\n\n        <div class=\"ai-in-flow\">AI in-the-flow<\u002Fdiv>\n\n        <div class=\"platform-stack\">\n          <div class=\"ps-title\">WORK PLATFORM<\u002Fdiv>\n          <div class=\"ps-sub\">System of Work thống nhất<\u002Fdiv>\n          <div class=\"ps-grid\">\n            <div class=\"ps-cell\">Work Hub<\u002Fdiv>\n            <div class=\"ps-cell\">Workflow<\u002Fdiv>\n            <div class=\"ps-cell\">Data + Graph<\u002Fdiv>\n            <div class=\"ps-cell\">Governance<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"pc-result-title\">Hệ quả<\u002Fdiv>\n        <ul class=\"pc-result-list\">\n          <li>Một nguồn sự thật, audit trail đầy đủ<\u002Fli>\n          <li>Teamwork graph làm giàu qua từng ngày<\u002Fli>\n          <li>ROI đo trực tiếp trên KPI vận hành<\u002Fli>\n          <li>Scale theo domain, business line<\u002Fli>\n        <\u002Ful>\n        <div class=\"pc-footer-note\">Lãi kép — càng dùng càng giá trị<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"figure-cap\">\n      <strong>Hình 2.<\u002Fstrong> Hai cách đưa AI vào tổ chức. Bên trái: tốc độ cá nhân tăng, nhưng tổ chức tích lũy nợ vận hành. Bên phải: AI sống trong luồng công việc thật, ROI có thể đo và mở rộng theo từng domain.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Hình 2 · Two ways to deploy AI<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 07 — Hình 3: Ba trụ cột Process / Behaviour / OpModel\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"07 Hinh 3 Three pillars\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">01 Khởi điểm <span class=\"sep\">·<\u002Fspan> Hình 3<\u002Fspan>\n    <span class=\"ph-page-num\">07<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Ba trụ cột — AI chỉ là tầng gia tốc phía trên.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 6mm; margin-bottom: 6mm;\">\n    Process sai + Behaviour lỏng + Operating Model rối = AI khuếch đại hỗn loạn. Thiết kế tốt ba trụ cột là điều kiện cần để AI sinh lãi kép.\n  <\u002Fp>\n\n  <div class=\"figure\">\n    <div class=\"pillars-wrap\">\n      <div class=\"pillars-header\">\n        <div class=\"ph-1\">AI — Clarifies <span style=\"color: var(--biplus-yellow-dark);\">·<\u002Fspan> Coordinates <span style=\"color: var(--biplus-yellow-dark);\">·<\u002Fspan> Compounds<\u002Fdiv>\n        <div class=\"ph-2\">Làm rõ ưu tiên — Điều phối giữa team/tool — Tích lũy giá trị theo thời gian<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pillars-arrow\"><\u002Fdiv>\n\n      <div class=\"pillars-row\">\n        <div class=\"pillar-card\">\n          <div class=\"pl-head\">PROCESS<\u002Fdiv>\n          <div class=\"pl-body\">\n            <div class=\"pl-tag\">Quy trình có hình dạng<\u002Fdiv>\n            <ul class=\"pl-list\">\n              <li>Trạng thái, transition<\u002Fli>\n              <li>SLA, rule, ownership<\u002Fli>\n              <li>Tối ưu cho automation và human-in-the-loop<\u002Fli>\n            <\u002Ful>\n            <div class=\"pl-note\">Trên Work Platform — không phải trên giấy hay Visio.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"pillar-card\">\n          <div class=\"pl-head\">BEHAVIOUR<\u002Fdiv>\n          <div class=\"pl-body\">\n            <div class=\"pl-tag\">Hành vi có kỷ luật<\u002Fdiv>\n            <ul class=\"pl-list\">\n              <li>Cập nhật task kịp thời<\u002Fli>\n              <li>Log work đầy đủ<\u002Fli>\n              <li>Chia sẻ tri thức<\u002Fli>\n              <li>Adoption gắn KPI<\u002Fli>\n            <\u002Ful>\n            <div class=\"pl-note\">Không đo, không khuyến khích — hệ thống thành vỏ rỗng.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"pillar-card\">\n          <div class=\"pl-head\">OPERATING MODEL<\u002Fdiv>\n          <div class=\"pl-body\">\n            <div class=\"pl-tag\">Cấu trúc tổ chức<\u002Fdiv>\n            <ul class=\"pl-list\">\n              <li>Team, phân quyền<\u002Fli>\n              <li>Project/space structure<\u002Fli>\n              <li>RACI rõ<\u002Fli>\n              <li>OKR cascade<\u002Fli>\n            <\u002Ful>\n            <div class=\"pl-note\">Cấu trúc tổ chức phải phản chiếu được trên System of Work.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"figure-cap\">\n      <strong>Hình 3.<\u002Fstrong> Ba trụ cột Process, Behaviour, Operating Model. AI là tầng gia tốc, không phải chất thay thế cho thiết kế vận hành.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout-dark\" style=\"margin-top: 8mm;\">\n    Thiết kế tốt ba trụ cột → AI sinh lãi kép. Bỏ qua → AI ăn dữ liệu sai và khuếch đại hỗn loạn.\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Hình 3 · Three pillars<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 08 — SECTION DIVIDER 02 — Khung hành động\n=================================================================== -->\n<section class=\"page section-page\" data-screen-label=\"08 Section 02\">\n  <div class=\"page-inner\">\n    <div>\n      <span class=\"sp-eyebrow\">Phần 02<\u002Fspan>\n      <div class=\"sp-num\">02<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h1 class=\"sp-title\">Khung hành động tối thiểu — năm bước bắt buộc trước khi chi thêm cho AI.<\u002Fh1>\n      <p class=\"sp-sub\">Nếu bỏ qua bất kỳ bước nào, mọi PoC AI vẫn sẽ chỉ là PoC. Đây là vạch xuất phát — chưa xong thì chưa scale AI.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Section 02 · Khung hành động<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 09 — Hình 4: 5 bước\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"09 Hinh 4 Five steps\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">02 Khung hành động <span class=\"sep\">·<\u002Fspan> Tổng quan 5 bước<\u002Fspan>\n    <span class=\"ph-page-num\">09<\u002Fspan>\n  <\u002Fheader>\n\n  <h2 class=\"t-h1\">Năm bước bắt buộc trước khi chi thêm cho AI.<\u002Fh2>\n  <p class=\"t-deck\" style=\"margin-top: 6mm; margin-bottom: 8mm;\">\n    Mỗi bước là một <strong>cổng kiểm soát<\u002Fstrong>: chưa qua thì không đi tiếp. Tổng thời gian cho cả khung này thường nằm trong 4 đến 6 tuần đầu của chương trình.\n  <\u002Fp>\n\n  <div class=\"figure\">\n    <div class=\"steps-row\">\n      <div class=\"step-card\">\n        <div class=\"sc-num\">1<\u002Fdiv>\n        <div class=\"sc-title\">Xác định<br>vấn đề<\u002Fdiv>\n        <ul class=\"sc-list\">\n          <li>Pain point rõ ràng<\u002Fli>\n          <li>KPI hiện trạng đo được<\u002Fli>\n          <li>Sponsor có tên<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"step-card\">\n        <div class=\"sc-num\">2<\u002Fdiv>\n        <div class=\"sc-title\">Mô hình hoá<br>workflow<\u002Fdiv>\n        <ul class=\"sc-list\">\n          <li>Step, role, tool, rule<\u002Fli>\n          <li>Lộ ra điểm nghẽn<\u002Fli>\n          <li>Bước thủ công<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"step-card\">\n        <div class=\"sc-num\">3<\u002Fdiv>\n        <div class=\"sc-title\">Đánh giá<br>dữ liệu<\u002Fdiv>\n        <ul class=\"sc-list\">\n          <li>Nguồn và chất lượng<\u002Fli>\n          <li>Quyền truy cập, compliance<\u002Fli>\n          <li>Tích hợp hạ tầng<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"step-card\">\n        <div class=\"sc-num\">4<\u002Fdiv>\n        <div class=\"sc-title\">Đặt KPI<br>đo được<\u002Fdiv>\n        <ul class=\"sc-list\">\n          <li>Cycle time, SLA, backlog<\u002Fli>\n          <li>NPS, adoption AI<\u002Fli>\n          <li>Log tự động<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"step-card\">\n        <div class=\"sc-num\">5<\u002Fdiv>\n        <div class=\"sc-title\">Phân công<br>RACI<\u002Fdiv>\n        <ul class=\"sc-list\">\n          <li>Owner quy trình<\u002Fli>\n          <li>Owner dữ liệu<\u002Fli>\n          <li>Owner policy AI<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"steps-callout\">\n      Vạch xuất phát bắt buộc — chưa xong thì chưa scale AI.\n    <\u002Fdiv>\n    <div class=\"figure-cap\">\n      <strong>Hình 4.<\u002Fstrong> Năm bước của Khung hành động tối thiểu. Mỗi bước là một cổng kiểm soát trước khi đi tiếp.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Hình 4 · Five-step minimum framework<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 10 — Bước 1: Xác định vấn đề\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"10 Buoc 1 Problem\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">02 Khung hành động <span class=\"sep\">·<\u002Fspan> Bước 01<\u002Fspan>\n    <span class=\"ph-page-num\">10<\u002Fspan>\n  <\u002Fheader>\n\n  <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 4mm;\">\n    <span style=\"font-family: var(--font-display); font-weight: 800; font-size: 38pt; color: var(--biplus-yellow-dark); line-height: 1;\">01<\u002Fspan>\n    <h2 class=\"t-h1\" style=\"margin: 0;\">Xác định vấn đề kinh doanh và vận hành ưu tiên.<\u002Fh2>\n  <\u002Fdiv>\n\n  <p class=\"t-body-lg\" style=\"margin-bottom: 8mm;\">\n    Chốt một đến ba vấn đề ưu tiên có đủ độ đau và đủ dữ liệu để triển khai trên Work Platform kết hợp AI. CIO nên yêu cầu mỗi đơn vị trả lời bốn câu hỏi sau — bằng số, không bằng cảm nhận.\n  <\u002Fp>\n\n  <div class=\"two-col\">\n    <div class=\"card\">\n      <div class=\"t-eyebrow\" style=\"color: var(--biplus-yellow-dark); margin-bottom: 4px;\">Câu hỏi 01<\u002Fdiv>\n      <div class=\"t-h3\" style=\"margin-bottom: 6px;\">Vấn đề hiện tại<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        Mô tả định tính kết hợp định lượng: cycle time hiện tại, kích thước backlog, tỷ lệ đáp ứng SLA, NPS, số lần rework trong tháng.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"t-eyebrow\" style=\"color: var(--biplus-yellow-dark); margin-bottom: 4px;\">Câu hỏi 02<\u002Fdiv>\n      <div class=\"t-h3\" style=\"margin-bottom: 6px;\">Tác động<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        Ảnh hưởng đến khách hàng, nhân sự, chi phí hay rủi ro tuân thủ ra sao — quy ra đơn vị đo được: tiền, giờ, hoặc số khách hàng bị ảnh hưởng.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"t-eyebrow\" style=\"color: var(--biplus-yellow-dark); margin-bottom: 4px;\">Câu hỏi 03<\u002Fdiv>\n      <div class=\"t-h3\" style=\"margin-bottom: 6px;\">Dữ liệu sẵn có<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        Dữ liệu đang nằm ở đâu, trong tool nào, chất lượng ra sao, có log hay audit trail không. Không có dữ liệu — vấn đề chưa sẵn sàng để gắn AI.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"t-eyebrow\" style=\"color: var(--biplus-yellow-dark); margin-bottom: 4px;\">Câu hỏi 04<\u002Fdiv>\n      <div class=\"t-h3\" style=\"margin-bottom: 6px;\">Đội sẵn sàng<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        Team hoặc bộ phận nào sẵn sàng làm pilot, ai là business sponsor có tên rõ ràng, ai là process owner chịu trách nhiệm sau PoC.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"example-card\" style=\"margin-top: 10mm;\">\n    <div class=\"ex-eyebrow\">Ví dụ minh hoạ<\u002Fdiv>\n    <div class=\"ex-title\">Một ngân hàng cổ phần tại Việt Nam<\u002Fdiv>\n    <p class=\"ex-body\">\n      Khi triển khai chương trình AI trên Work Platform, phòng Vận hành chốt vấn đề với con số cụ thể: thời gian xử lý yêu cầu nội bộ trung bình từ nhân viên chi nhánh. Họ đặt KPI baseline trước, gắn sponsor cấp Giám đốc Khối, và chỉ chọn ba quy trình đầu tiên có đầy đủ log trong hệ thống.\n    <\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"callout-yellow\" style=\"margin-top: 8mm;\">\n    Một quy tắc đơn giản: nếu vấn đề không trả lời được cả bốn câu hỏi trên, đừng đưa vào chương trình AI tuần này.\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Bước 01 · Xác định vấn đề<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 11 — Bước 2: Mô hình hoá workflow\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"11 Buoc 2 Workflow\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">02 Khung hành động <span class=\"sep\">·<\u002Fspan> Bước 02<\u002Fspan>\n    <span class=\"ph-page-num\">11<\u002Fspan>\n  <\u002Fheader>\n\n  <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 4mm;\">\n    <span style=\"font-family: var(--font-display); font-weight: 800; font-size: 38pt; color: var(--biplus-yellow-dark); line-height: 1;\">02<\u002Fspan>\n    <h2 class=\"t-h1\" style=\"margin: 0;\">Mô hình hoá lại quy trình hiện tại trên Work Platform.<\u002Fh2>\n  <\u002Fdiv>\n\n  <p class=\"t-body-lg\" style=\"margin-bottom: 6mm;\">\n    Sau khi có vấn đề ưu tiên, vẽ lại bức tranh <strong>as-is<\u002Fstrong> của luồng công việc: ai làm gì, trên hệ thống nào, theo rule nào, với SLA bao nhiêu. Mục tiêu là cùng nhìn thấy điểm nghẽn, bước thủ công và chỗ chưa có owner.\n  <\u002Fp>\n\n  <div class=\"two-col\" style=\"margin-bottom: 6mm;\">\n    <div>\n      <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Workshop mapping hiệu quả<\u002Fh3>\n      <ul class=\"bp-list\">\n        <li>Nửa ngày đến một ngày, có cả <strong>business · vận hành · IT<\u002Fstrong>.<\u002Fli>\n        <li>Vẽ trực tiếp lên Work Platform — không dùng Visio rời.<\u002Fli>\n        <li>Đánh dấu rõ step thủ công, handoff, hệ thống nguồn dữ liệu.<\u002Fli>\n        <li>Output: as-is + to-be + danh sách điểm có thể nhúng AI/automation.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div>\n      <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Mô tả workflow phải trả lời<\u002Fh3>\n      <ul class=\"bp-list\">\n        <li><strong>Step:<\u002Fstrong> các trạng thái và transition.<\u002Fli>\n        <li><strong>Role:<\u002Fstrong> ai làm, ai duyệt, ai bị ảnh hưởng.<\u002Fli>\n        <li><strong>Tool:<\u002Fstrong> hệ thống nguồn, hệ thống ghi nhận.<\u002Fli>\n        <li><strong>Rule:<\u002Fstrong> SLA, ngưỡng escalation, điều kiện rẽ nhánh.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"example-card\">\n    <div class=\"ex-eyebrow\">Ví dụ minh hoạ<\u002Fdiv>\n    <div class=\"ex-title\">Techcombank — tái thiết kế quy trình tín dụng bán lẻ<\u002Fdiv>\n    <p class=\"ex-body\">\n      Trong chương trình số hoá trải nghiệm khách hàng lĩnh vực tín dụng bán lẻ, đội dự án vẽ lại toàn bộ luồng từ lúc khách hàng nộp hồ sơ đến khi giải ngân: bóc tách các bước thủ công còn nằm ngoài hệ thống, gộp các handoff giữa chi nhánh và hội sở, và chỉ ra điểm nào có thể nhúng AI để pre-fill và validate hồ sơ. Tất cả workflow mới được chuẩn hoá ngay trên một nền tảng thống nhất, cho phép đo cycle time và backlog theo thời gian thực.\n    <\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"callout-dark\" style=\"margin-top: 8mm;\">\n    Chính việc mô tả lại quy trình trên Work Platform sẽ tự lộ ra những bước có thể giao cho AI hoặc automation — và những chỗ cần chuẩn hoá dữ liệu, hành vi trước.\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Bước 02 · Mô hình hoá workflow<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 12 — Bước 3: Đánh giá dữ liệu\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"12 Buoc 3 Data\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">02 Khung hành động <span class=\"sep\">·<\u002Fspan> Bước 03<\u002Fspan>\n    <span class=\"ph-page-num\">12<\u002Fspan>\n  <\u002Fheader>\n\n  <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 4mm;\">\n    <span style=\"font-family: var(--font-display); font-weight: 800; font-size: 38pt; color: var(--biplus-yellow-dark); line-height: 1;\">03<\u002Fspan>\n    <h2 class=\"t-h1\" style=\"margin: 0;\">Đánh giá dữ liệu và ràng buộc.<\u002Fh2>\n  <\u002Fdiv>\n\n  <p class=\"t-body-lg\" style=\"margin-bottom: 8mm;\">\n    AI chỉ tốt bằng dữ liệu và quyền truy cập mà nó có. Đánh giá dữ liệu — và các ràng buộc đi kèm — theo ba trục dưới đây trước khi cam kết bất kỳ use case AI nào.\n  <\u002Fp>\n\n  <div style=\"display: flex; flex-direction: column; gap: 6mm;\">\n    <div class=\"card yellow\">\n      <div class=\"t-eyebrow\" style=\"color: var(--biplus-yellow-dark); margin-bottom: 4px;\">Trục 01<\u002Fdiv>\n      <div class=\"t-h3\" style=\"margin-bottom: 6px;\">Nguồn dữ liệu<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        Dữ liệu đang nằm ở Work Platform hay rải rác ngoài đó? Đầy đủ và nhất quán đến đâu? Có <strong>taxonomy<\u002Fstrong> và <strong>tagging<\u002Fstrong> chung không? Nếu dữ liệu vẫn ở email, Excel, file local — AI sẽ không thấy đủ ngữ cảnh để ra quyết định.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"card blue\">\n      <div class=\"t-eyebrow\" style=\"color: var(--biplus-blue-dark); margin-bottom: 4px;\">Trục 02<\u002Fdiv>\n      <div class=\"t-h3\" style=\"margin-bottom: 6px;\">Quyền truy cập và bảo mật<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        Ai được thấy gì trong luồng này? Có dữ liệu nhạy cảm cần <strong>masking<\u002Fstrong> hoặc <strong>redaction<\u002Fstrong>? Quy định nào đang áp dụng — GDPR cho dữ liệu cá nhân, quy định ngành ngân hàng, ISO 27001, data residency. AI phải tuân thủ chính sách của con người, không lách bằng cách bypass quyền.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"card tint\">\n      <div class=\"t-eyebrow\" style=\"color: var(--biplus-yellow-dark); margin-bottom: 4px;\">Trục 03<\u002Fdiv>\n      <div class=\"t-h3\" style=\"margin-bottom: 6px;\">Hạ tầng và tích hợp<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0;\">\n        Cần kết nối với ERP, CRM, ITSM nào? Đã có API hoặc connector sẵn, hay phải xây mới? Thời gian và chi phí phát triển integration thường bị đánh giá thấp — đưa nó vào kế hoạch ngay từ đầu, không để pilot bị treo vì chờ một connector.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout-dark\" style=\"margin-top: 9mm;\">\n    Chỉ khi dữ liệu hội tụ lên Work Platform với log và audit trail rõ ràng, AI mới có thể vừa hiệu quả vừa an toàn. Dữ liệu nằm ngoài System of Work → AI nằm ngoài tầm kiểm soát.\n  <\u002Fdiv>\n\n  <div class=\"ph-footer\">\n    <div class=\"logos\">\n      <img class=\"logo-biplus\" src=\"84a1c793-b921-47ec-a129-011303d0faf4\" alt=\"BiPlus\">\n      <img class=\"logo-atlassian\" src=\"6cca61e3-dfd8-4bf7-8752-a2076e9dec56\" alt=\"Atlassian Platinum Solution Partner\">\n    <\u002Fdiv>\n    <div class=\"ph-ref\">Bước 03 · Đánh giá dữ liệu<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================================================================\n     PAGE 13 — Bước 4: KPI/OKR\n=================================================================== -->\n<section class=\"page\" data-screen-label=\"13 Buoc 4 KPI\">\n  <header class=\"ph-header\">\n    <span class=\"ph-eyebrow\">02 Khung hành động <span class=\"sep\">·<\u002Fspan> Bước 04<\u002Fspan>\n    <span class=\"ph-page-num\">13<\u002Fspan>\n  <\u002Fheader>\n\n  <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 4mm;\">\n    <span style=\"font-family: var(--font-display); font-weight: 800; font-size: 38pt; color: var(--biplus-yellow-dark); line-height: 1;\">04<\u002Fspan>\n    <h2 class=\"t-h1\" style=\"margin: 0;\">Đặt tiêu chí đo lường trước khi triển khai.<\u002Fh2>\n  <\u002Fdiv>\n\n  <p class=\"t-body-lg\" style=\"margin-bottom: 6mm;\">\n    Mọi sáng kiến AI phải gắn với KPI hoặc OKR <strong>đo được trên chính nền tảng<\u002Fstrong>, không dựa vào cảm tính người dùng. Ba nhóm chỉ số bắt buộc:\n  <\u002Fp>\n\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4mm; margin-bottom: 6mm;\">\n    <div class=\"card\" style=\"padding: 10px 12px;\">\n      <div class=\"tag-pill yellow\" style=\"margin-bottom: 4px;\">Hiệu suất quy trình<\u002Fdiv>\n      <p class=\"t-body\" style=\"margin: 0; font-size: 9.5pt;\">\n        Cycle time, lead time, throughput, tỷ lệ đáp ứng SLA, bac
